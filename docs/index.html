<script id="data" type="application/json">{"schema_version":2,"book_id":"652dcdaa8cfb706f92e21f9094a3199e97b5c625bc5fa804bd349d426a3284ff","complete":true,"expected_chapters":41,"name":"学会学习","chapters":[{"key":"ch-01","title":"专注模式与发散模式简介","file":"chapter-001.mp3","sha256":"aab6f25f287fc44ef0ef2b0b65e9e24d33f1a5ed943b470ac087477a3122f55f","paragraphs":[{"text":"当你完全想不通某件事时，你会怎么做？对于僵尸来说，这很简单。它们可以只是不停地用脑袋撞墙。但活着的脑子要复杂得多。不过事实证明，如果你能稍微了解一些关于大脑运作原理的基础知识，你就能更轻松地学习，并且减少挫败感。"},{"text":"研究人员发现，我们拥有两种根本不同的思维模式。在这里，我将它们称为专注模式和发散模式。我们对专注很熟悉。当你全神贯注于试图学习或理解某事时，就是专注。但我们对发散思维并不那么熟悉。事实证明，这种更放松的思维方式与一组神经静息状态有关。我们将使用弹珠台游戏的类比来帮助理解这两种思维模式。顺便说一下，当你试图学习新事物时，隐喻和类比真的很有帮助。"},{"text":"如果你还记得，弹珠台游戏是这样运作的：你拉回发射杆，释放它，一个球就“砰”地弹射出去，在橡胶挡板上弹来弹去，这就是你得分的方式。所以，这是你的大脑，耳朵在这里，眼睛向上看。我们可以把那个弹珠台直接放在里面。好了，这就是专注模式的类比。这里的蓝色挡板彼此靠得很近。看到顶部这个橙色图案了吗？它代表一种熟悉的思维模式。也许涉及像加数字这样简单的事情，或者像文学批评或计算电磁流这样更高级的概念。你想到一个念头，砰，它起飞了，沿着路径平滑地移动。然后，当它在挡板上弹来弹去时，你能够解决你试图解决的问题，或者理解你试图理解的概念，而这个概念与你相当熟悉的东西有关。看看那个念头是如何在模糊的底层橙色神经通路上平滑移动的。在某种意义上，就好像它正沿着一条熟悉的、铺设良好的道路行驶。"},{"text":"但如果你正在处理的问题需要新的想法或方法呢？那些你以前从未想过的概念。这由弹珠台区域底部的这个神经模式来象征。但如果你以前没有想过那个念头，你甚至不知道那个模式感觉如何，或者它在哪里。那么，你首先将如何发展出那个新念头呢？你不仅不知道模式在哪里，或者模式看起来是什么样，而且看看所有那些橡胶挡板，无论你决定朝哪个方向移动，它们都在阻挡你的通路。要到达这个新的思维模式，你需要一种不同的思维方式。而这里所代表的，就是发散模式。"},{"text":"看看橡胶挡板之间的间距有多宽。念头起飞了，看看它如何广泛地移动，弹来弹去。在碰到挡板之前，它可能会走很长的路。在这种发散思维模式中，你可以从一个非常不同的、宏观的视角广泛地看待事物。你可以沿着新的通路建立新的神经连接。你无法像通常需要的那样紧密地聚焦，以最终解决任何问题。或者理解一个概念最细微的方面。但至少，你可以到达你需要到达的初始位置，以便锁定解决方案。"},{"text":"就神经科学家目前所知，你要么处于专注模式，要么处于发散思维模式。似乎你不能同时处于两种思维模式中。这有点像一枚硬币。我们可以看到硬币的一面，或者另一面。但不能同时看到两面。处于一种模式似乎会限制你进入另一种模式的思维方式。在我们的下一个视频中，我们将看到一些非凡的人如何利用他们的发散思维方式来成就伟大的事情。"},{"text":"感谢学习如何学习。我是芭芭拉·奥克利。"}]},{"key":"ch-02","title":"特伦斯·塞诺斯基与芭芭拉·奥克利 - 课程结构介绍","file":"chapter-002.mp3","sha256":"d7b6fbd6ad22712142af81e9f09c951ae10ea3627529cb3b8695d4a2e38bc337","paragraphs":[{"text":"塞诺斯基博士：欢迎来到《学会学习》。你的大脑拥有惊人的能力，但它并没有附带一本使用说明书。也许我们的大脑给予我们最珍贵的礼物，就是每天都能学习新事物的能力。在来这里的路途中，我思考了将带领我们抵达课程最后一天的这段旅程，以及我们一路上将学到多少东西。我们的目标是让你更好地理解我们是如何学习的，从而使你的大脑成为一个更善于学习的器官。这些洞见基于神经科学和认知心理学的扎实研究，也来自数十位难学科目领域的顶尖讲师和从业者的见解。无论你是新手还是专家，你都会发现许多提升技能和技巧的新方法，尤其是与数学和科学相关的方法。"},{"text":"奥克利博士：这门课程旨在帮助你重新构建对学习的看法，帮助你减少挫败感并增加理解。我们的方式有些不同。我们并不期望你在任何特定学科上都有深入的背景知识。相反，我们期望你将这些理念应用到任何你试图学习或改进的学科中，帮助你更深入、更有效地学习，并减少挫败感。你将听到来自不同学科的专家谈论他们关于更有效地学习的最佳建议。无论你是在高中苦苦挣扎，还是在大学研究生阶段在数学和科学领域如鱼得水，你都能从这些理念中受益。"},{"text":"塞诺斯基博士：我是位于拉霍亚的一个由美国国家科学基金会资助的科学和学习中心的联合主任。近年来，我们在研究方面取得了巨大进展，发现了如何最有效地学习。找到一种简单而有效的方式将这些理念分享给你们，是一项巨大的工程，但我们觉得这非常值得。你会看到，虽然这些理念中的许多都很简单，但它们却拥有惊人的力量。而且在这个过程中，我们在教你的同时，自己也会学到很多东西。"},{"text":"奥克利博士：你将看到自己是如何在是否真正掌握材料方面欺骗自己的。你将发现新的方法来保持专注，并将材料更深入、更有力地嵌入你的脑海中。你将学会将正在学习的关键理念进行压缩，以便更容易地掌握它们，掌握这里概述的简单、实用的方法，包括帮助防止拖延的简单技巧。你将能够更有效地学习，并减少挫败感。这门课程旨在丰富你的学习和生活。你将能够从这些材料中获得你想要的东西。所以，欢迎加入本课程，祝学习愉快！"}]},{"key":"ch-03","title":"使用专注模式与发散模式——或者，一点达利式的做法","file":"chapter-003.mp3","sha256":"4797c032759e4b594f729c410aa9644b7e524b57a81914f68e5b09daa917b60d","paragraphs":[{"text":"让我们来看看历史上一些名人，他们如何利用不同的思维模式来辅助自己的问题解决。如果你看那里的那个人，他是萨尔瓦多·达利，二十世纪一位非常著名的超现实主义画家。他简直就是狂野疯狂之人的典型。你可以看到，他在这里和他的宠物豹猫巴布在一起。"},{"text":"达利过去有一种有趣的技术，帮助他构思出那些极具创造力的超现实主义画作。他会放松地坐在椅子上，让他的思想自由驰骋，通常仍然在模糊地思考着他之前专注的事情。他手里会拿着一把钥匙，让它悬在地板上方。当他滑入梦境、开始入睡时，钥匙会从手中掉落，发出的声响会把他惊醒，正好让他能够收集起脑海中那些发散模式下的联系和想法。然后，他就会回到专注模式，带着他在发散模式中建立的新联系继续前行。你可能会想，嗯，这对艺术家来说可能没问题，但这与更科学或数学类的思维有什么关系呢？"},{"text":"好吧，如果你往下看，这个人就是托马斯·爱迪生，有史以来最杰出的发明家之一。根据传说，爱迪生过去会坐在椅子上放松，手里拿着滚珠轴承。他会放松下来，让思想自由运行，尽管它往往会以一种更加放松的方式，回到他之前专注的事情上。当爱迪生入睡时，滚珠轴承会掉落并撞击地面发出声响，就像达利那样，这会把爱迪生惊醒，然后他就带着来自发散模式的想法出发了，准备将它们带入专注模式并在此基础上进行构建。"},{"text":"所以，关键在于，当你学习新事物时，尤其是稍微困难一点的东西，你的大脑需要在两种不同的学习模式之间来回切换。这就是帮助你有效学习的原因。你可以把它类比为通过举重来增强力量。你绝不会计划在举重比赛的前一天才开始像疯子一样整天锻炼。我的意思是，事情根本不是这样发生的。为了获得肌肉结构，你需要每天做一点工作，逐渐让肌肉生长。同样，为了构建神经结构，你需要每天做一点工作，逐渐让自己生长出一个神经支架来承载你的思维，每天一点点，这就是诀窍。"},{"text":"总结一下："},{"text":"我们了解到，类比提供了强大的学习技术。"},{"text":"我们了解了大脑的两种不同思维模式——专注模式和发散模式——如何以非常不同的方式帮助我们学习。"},{"text":"最后，我们了解到，学习困难的东西可能需要时间。你的大脑需要在与新材料进行斗争和吸收的过程中，交替使用不同的学习方式。"},{"text":"感谢大家学习关于学习的内容。我是芭芭拉·奥克利。"}]},{"key":"ch-04","title":"什么是学习？","file":"chapter-004.mp3","sha256":"7fcf43d478293d9574e5b4b221ee9c79bfe58955d650fc06935e8479c5c5e7ad","paragraphs":[{"text":"欢迎来到《学会学习》。我是特里·塞诺斯基。让我来向你们介绍你们的大脑吧！"},{"text":"首先，我们来做一点脑部手术。我们取下头骨，把大脑取出来。这个大脑重三磅，但按重量计算，它消耗的能量是身体其他部位的十倍，这是一个非常昂贵的器官。它是已知宇宙中最复杂的装置。你所有的思想、希望、恐惧，都存在于这个大脑的神经元中。我们珍视下棋和做数学的能力，但获得这些技能需要多年的练习。而在这些方面，数字计算机比我们要好得多。令人惊讶的是，我们发现我们做得很好且视为理所当然的事情，比如看、听、伸手、奔跑，实际上都比我们想象的要复杂得多，远远超出了世界上最快的数字计算机的能力。这说明了，我们并没有意识到我们的大脑是如何工作的。"},{"text":"大脑的进化是为了帮助我们应对复杂的环境，而大部分繁重的工作是在我们的意识水平之下完成的。为了生存，我们不需要知道它是如何做到的。研究潜意识的心理学家发现，潜意识的影响包括思维过程、记忆、情感和动机。我们只意识到大脑所有活动中极小的一部分，因此我们需要依靠脑成像技术来引导我们。"},{"text":"这是某个人在脑成像扫描仪中保持静止、处于休息状态时的大脑活动图。左边是大脑的侧面视图，右边是沿中线观察的视图。颜色表示活动高度相关的大脑区域，如下方的时间进程曲线所示，这些曲线按大脑区域进行了颜色编码。当受试者与外界互动时，蓝色区域高度活跃，但在休息状态下会关闭。红橙色区域在休息状态下最活跃，被称为默认模式网络。其他大脑区域在你休息时也更活跃，这些区域可以进一步划分为具有共同活动模式的区域组。这是一个新兴且研究激烈的领域，需要时间来理清所有的休息状态及其功能。"},{"text":"你的大脑中有万亿个突触，记忆就存储在那里。关于大脑的旧观点认为，一旦大脑成熟，突触的强度可以通过学习来调整，但除非发生脑损伤，否则连接模式不会发生太大变化。但现在我们知道，大脑的连接是动态的，即使在大脑成熟后依然如此。利用新的光学技术，对神经元之间被称为突触的单个连接进行成像，我们可以看到持续的更替，新的突触不断形成，而其他的则消失。这提出了一个谜题。面对如此多的更替，记忆是如何在这么多年里保持稳定呢？"},{"text":"这是一张神经元上一个树突分支的图片，它接收来自其他神经元的输入。突触位于从树突伸出的带棘突的突起上。上方显示的是在学习之前对该树突的成像。下方显示的是同一树突在学习和睡眠之后的样子。白色箭头指示了在同一分支上同时新形成的多个突触。你正在向下观察一只活体动物的大脑。这真是一项了不起的新技术。突触的直径小于一微米。相比之下，一根人类头发的直径约为二十微米。这项新技术使我们能够以接近光学显微镜极限的分辨率，看到学习如何改变大脑的结构。"},{"text":"这有趣地说明了，经过一夜睡眠甚至一个小盹之后，你就不再是原来的那个人了。这就像你带着一个大脑上床睡觉，醒来时却得到了一个升级版本。这比你能从微软那里得到的交易要好得多。伟大的英国诗人莎士比亚早就知道这一点。这里是麦克白对他失眠的哀叹：“睡眠，那缝合起忧虑破碎衣袖的，每日生命的终结，辛苦劳作的沐浴，受伤心灵的慰藉，大自然的第二道佳肴，生命盛宴中的主要滋养。”在这里，莎士比亚在针织衣物和睡眠之间做了一个类比，睡眠将白天经历和担忧的松散线头缝合起来，将它们编织进你人生故事的挂毯中。"},{"text":"在第一周，你将学会如何利用你的潜意识，以及睡眠，来使学习新事物和解决问题变得更加容易。在讲座期间，你可能会问自己，大脑是如何做到这一点的？想了解更多关于你大脑的信息，brainfacts.org 是一个很好的地方，brainfacts，一个单词，.org（http://www.brainfacts.org/）。你会在那里发现大量关于大脑和行为、特别是关于学习和记忆的有趣内容。"},{"text":"我是特里·塞诺斯基。祝你们学习愉快，我们下次再见。"}]},{"key":"ch-05","title":"拖延症预览","file":"chapter-005.mp3","sha256":"fb6443da981ad906a34782342e718e2426c98f89ceb7f1c66cfc908138e7e42d","paragraphs":[{"text":"每个人在拖延方面都有一些困扰。因为如果你正在处理某件事，就意味着你没有在处理许多其他事情。但有些人比其他人更容易受到拖延的困扰。在这个视频中，我们将为你提供一些关于拖延的见解。它为何产生，以及一个强大的小工具来帮助你应对它。"},{"text":"当你看着某件你其实很不想做的事情时，似乎你激活了大脑中与疼痛相关的区域。你的大脑，很自然地，会寻找一种方式来停止这种负面刺激，通过把你的注意力转移到其他事情上。但这里有个诀窍。研究人员发现，在人们可能真正开始处理他们不喜欢的事情后不久，那种神经上的不适感就消失了。所以，当你拖延时，似乎发生的是这样一件事：首先，你观察到某个引起一点点不安的线索。你不喜欢它，所以为了让这种感觉消失，你把注意力从引起不安的事物上移开。你转向更令人愉悦的事情。结果，你暂时感觉更快乐了。"},{"text":"我们稍后会更多地谈论拖延。但在此期间，我要让你了解一个实用的小心理工具。这个工具叫做番茄工作法。它是由弗朗切斯科·西里洛在二十世纪八十年代初发明的。Pomodoro在意大利语中是“番茄”的意思。你使用的计时器通常看起来像一个番茄，实际上，一个计时器就是这项优雅小技术的全部。你只需要把计时器设定为25分钟，关掉所有干扰，然后专注。就这样！大多数人可以专注25分钟。最后唯一重要的事情是，当你完成后给自己一点奖励。几分钟的网上冲浪，一杯咖啡，或一块巧克力，甚至只是伸展身体或漫无目的地聊天，让你的大脑愉快地改变焦点一段时间。你会发现使用番茄工作法非常有效。它有点像在心理健身房进行25分钟的剧烈锻炼。随后进行一些心理放松。试试看吧。"},{"text":"接下来，我们将看到一个非常害羞的十岁女孩是如何改变她的大脑的。"}]},{"key":"ch-06","title":"熟能生巧","file":"chapter-006.mp3","sha256":"c061137d58061c9f5f24524f65d77f903cfab5ee65243bff293a4b5b22780bda","paragraphs":[{"text":"没错，这就是我十岁时的样子。那时候，我热爱动物、手工艺和做梦。在那个年纪，我是反数学的“好斗女王”。在整个小学、初中和高中期间，我忽视、无视、挂科，甚至痛恨数学和科学。现在回想起来，我竟然成了一名工程学教授，这感觉很奇怪。高中一毕业，我就参军了，在国防语言研究所学习语言。这是我十八岁时的照片，当时我投掷手榴弹，看起来既紧张又专注。"},{"text":"直到二十六岁，我退役后，才开始学习数学和科学。起初，这真的很难。班上有很多思维敏捷的人，他们似乎比我更容易、更快地掌握所有内容。有时候，我会休息几个月，出去在苏联的拖网渔船上做俄语翻译。那是我在白令海上的照片。然后我会回到学校，尝试再学一些。随着我获得技术知识，新的机会开始为我敞开。我最终在位于南极洲的南极站担任无线电操作员。我在那里遇到了我的丈夫。我总是说，为了遇到那个男人，我不得不去地球的最南端。这是他刚在零下七十华氏度、风速每小时六十英里的户外待了十分钟后的样子。风寒效应让温度低得无法测量。"},{"text":"我在数学和科学方面并不具有天赋。完全不是。我成功的方式是逐渐摸索出一些技巧。但让我们退后一步。在人们可以追求的各种职业和学科的大格局中，为什么涉及数学和科学的领域有时更具挑战性？我们认为，这至少部分与这些想法的抽象性质有关。我的意思是，以一头牛为例，它站在田野里。如果你知道“牛”这个词，你可以直接指向一头牛来学习这个词的含义。甚至“牛”这个单词的字母 C-O-W，也大致类似于它们所代表的声音。但对于数学概念，通常没有你可以直接指向的类似事物。田野里没有突出的加号。没有可以指给你看、直接对应乘法、除法或其他数学科学概念的东西。换句话说，这些术语更加抽象。你可能会说，是的，但像爱、热情或希望这样的词呢？它们也都是抽象的。是的，它们确实是，但关键在于，这些抽象术语通常与我们的情感有关。即使我们无法看到并指向像牛那样的具体例子，我们也能感受到自己的情感。这意味着，在学习数学和科学时，练习你正在学习的想法和概念非常重要，就像你正在学习的其他任何事情一样，以增强和加强你在学习过程中建立的神经连接。"},{"text":"你可以在这里左边看到一个思维模式的符号化表示。神经元通过重复使用而相互连接。某事物越抽象，为了将这些想法变为现实，练习就越重要。即使你处理的想法是抽象的，你正在创建的神经思维模式也是真实和具体的。至少，如果你通过练习来构建和加强它们，它们就是如此。这里有一种方式来想象正在发生的事情。当你开始理解某事时，例如如何解决问题，神经模式就在那里，但非常微弱。有点像我们这里弹珠机类比中顶部的微弱图案。当你从头开始再次解决问题，而不看答案时，你开始加深那个神经元模式，有点像你在这里中间看到的较深图案。当你完全掌握问题，能够在脑海中完全且简洁地过每一步，甚至不看答案，并且你甚至已经在相关问题上练习过，那么，这个模式就像你在弹珠机框架底部看到的这个深色坚固图案。熟能生巧，或者说，练习使之永久。"},{"text":"当你在学习时，你要做的是研究某样东西。通过全神贯注来努力学习它。然后休息一下，或者至少将注意力转移到其他不同的事情上一段时间。在这个看似放松的时间里，你的大脑的发散模式有机会在后台工作，帮助你进行概念理解。从某种意义上说，你的神经砂浆有机会干燥。如果你不这样做，而是通过突击学习来学习，你的知识库会看起来更像这样，所有东西都杂乱无章，一切都很混乱，基础很差。如果你有拖延症，那就是你想使用番茄工作法的时候，那个简短的计时器。这有助于你开始行动，利用每天短暂的专注注意力时段，这将帮助你开始构建你在学习更具挑战性的材料时所需的神经模式，从而更加成功。下一站，我们将讨论组块，这是你掌握和精通关键想法的精髓。"},{"text":"我是芭芭拉·奥克利。"}]},{"key":"ch-07","title":"记忆简介","file":"chapter-007.mp3","sha256":"77e3400caeacabbd6176202df92e8937010796ca341c9d4b86af673d2ef9b997","paragraphs":[{"text":"当我回顾我的童年，或者想起西班牙语或俄语中的某些词汇，比如“Здравствуйте”（你好），或者在脑海中浮现麦克斯韦方程组中的一个方程时，我正在调用大脑中涉及长期记忆的部分。但是，当我试图在脑海中保持几个想法并将它们连接在一起，以便理解一个概念或解决一个问题时，我使用的是工作记忆。显然，有时我会将长期记忆中的某些内容带入工作记忆，以便对其进行思考。因此，这两种类型的记忆是相关的。有很多不同的方式来划分我们对记忆的理解，但在这门关于学习的课程中，我们将只讨论这两个主要的记忆系统：工作记忆和长期记忆。"},{"text":"工作记忆是记忆中与你在脑海中立即且有意识处理的内容有关的部分。你的工作记忆以前额叶皮层为中心，尽管正如我们稍后所见，它也与大脑的其他部分有连接，因此你可以访问长期记忆。研究人员过去认为，我们的工作记忆可以容纳大约七个项目或组块，但现在人们普遍认为，工作记忆只能容纳大约四个信息组块。我们倾向于自动将记忆项目组合成组块，因此我们的工作记忆似乎比实际要大。虽然你的工作记忆像一块黑板，但它并不是一块很好的黑板。你通常需要不断重复你正在处理的内容，以便它保留在你的工作记忆中。例如，你有时会对自己重复一个电话号码，直到你有机会把它写下来。需要重复，是为了让你的代谢吸血鬼，也就是自然的消散过程，不会把这些记忆吸走。当你集中注意力时，你可能会发现自己闭上眼睛，以防止其他任何项目侵入你工作记忆中有限的槽位。"},{"text":"所以，我们知道短期记忆就像一块效率低下的心理黑板。另一种形式的记忆，长期记忆，就像一个存储仓库。就像仓库一样，它分布在一个很大的区域。不同类型的长期记忆存储在大脑的不同区域。研究表明，当你第一次试图将短期记忆放入长期记忆时，你需要至少重新访问它几次，以增加你以后在需要时能够找到它的可能性。长期记忆存储仓库是巨大的。它有空间容纳数十亿个项目。事实上，项目可能多到它们会互相掩埋，因此，除非你进行练习并至少重复几次，否则你可能很难找到你需要的信息。"},{"text":"长期记忆很重要，因为它是你存储基本概念和技术的地方，而这些概念和技术通常涉及你正在学习的内容。当你遇到新事物时，你通常使用工作记忆来处理它。如果你想将信息转移到长期记忆中，通常需要时间和练习。为了帮助这一过程，使用一种称为间隔重复的技术。这种技术涉及重复你试图保留的内容，但你要做的是将这种重复分散开来。例如，在几天内重复一个新词汇或问题解决技术。将练习扩展到几天确实会有所不同。"},{"text":"研究表明，如果你试图通过在某个晚上重复某事二十次来将其粘在记忆中，它的效果远不如在几天内练习相同次数。这就像我们之前看到的砌砖墙。如果你不留下时间让砂浆干燥，也就是让突触连接形成和加强的时间，你就不会有一个很好的结构。说到持久的结构，看看这里的卫城部分。"},{"text":"感谢学习如何学习。我是芭芭拉·奥克利。"}]},{"key":"ch-08","title":"睡眠在学习中的重要性","file":"chapter-008.mp3","sha256":"d78485c758aa66add5d60588489e45d92908330ac21fa6182340e937e0a218af","paragraphs":[{"text":"你可能会惊讶地发现，仅仅是保持清醒状态，就会在你的大脑中产生有毒物质。大脑是如何清除这些毒素的呢？事实证明，当你睡觉时，你的脑细胞会收缩。这导致脑细胞之间的空间增大。这就像疏通了一条溪流。流体可以流过这些细胞，将毒素冲刷出去。因此，睡眠，有时看起来像是浪费时间的行为，实际上是大脑保持自身清洁和健康的方式。"},{"text":"所以，让我们直接切入一个关键概念。在没有获得充足睡眠的情况下参加考试，意味着你的大脑在运作时，仍有一些细小的代谢毒素漂浮其中。这些毒素会让你无法清晰地思考。这有点像试图驾驶一辆油箱里加了糖的汽车。它运行得并不好。事实上，睡眠不足不仅会让你在考试中表现更差，长期睡眠不足还与各种糟糕的状况有关，包括头痛、抑郁、心脏病、糖尿病，以及仅仅是更早地死亡。"},{"text":"但睡眠的作用不仅仅是让大脑冲刷掉毒素。它实际上是记忆和学习过程的重要组成部分。似乎在你睡觉时，你的大脑会整理你正在思考和学习的那些想法和概念。它会擦除记忆中不太重要的部分，同时强化你需要或想要记住的区域。在睡眠期间，你的大脑还会排练你正在尝试学习的内容中较难的部分，一遍又一遍地复习神经模式，以加深和强化它们。研究还表明，睡眠能显著影响你解决难题和理解所学内容的能力。这似乎是因为位于大脑前额叶皮层最前端的意识自我的完全停用，有助于大脑的其他区域更容易地相互沟通，允许它们在你睡觉时组合出解决你学习任务所需的神经方案。"},{"text":"当然，你也必须首先通过进行专注模式的工作，来为你进入发散模式播下种子。如果你在打盹或晚上睡觉前复习你正在学习的内容，你梦见它的几率会增加。如果你更进一步，在脑海中设定你想要梦见这些材料的意图，似乎会进一步提高你梦见它们的几率。梦见你正在学习的内容可以显著增强你的理解能力。它以某种方式将你的记忆巩固成更容易把握的组块。"},{"text":"现在，是时候小睡一会儿了。"}]},{"key":"ch-09","title":"模块1总结视频","file":"chapter-009.mp3","sha256":"2e40cd6a0a0e15c6d31b24c3d4c9c4fddf5242045fa70685209f6e307b6942d6","paragraphs":[{"text":"尽管活着的大脑相当复杂，但本周我们使用了隐喻、类比以及僵尸来帮助简化问题。本质上，人们有两种根本不同的思维模式，为了这门课程的目的，我们将它们标记为专注模式和发散模式。我们使用了一个简单的弹珠台类比，来帮助我们理解这两种模式之间的差异。"},{"text":"专注模式中橡胶挡板的间距较紧，这在某种程度上似乎有助于保持你的思维集中。另一方面，发散模式中的挡板间距更宽，允许更广泛、更发散的思维方式。专注模式更多地集中在前额叶皮层，它通常涉及思考你多少有些熟悉的事物。例如，如果你熟悉乘法，正在尝试解决一个乘法问题，或者正在尝试找一个与另一个词押韵的词。你很可能正在沿着专注模式那些多少有些熟悉的路径前行。但如果你正在尝试解决或弄清楚一些新事物，它往往呼唤发散模式那种更广泛、更发散的视角。事实证明，这种模式代表了大脑的许多神经静息状态。"},{"text":"纵观历史，无论属于哪个学科，富有创造力的思考者都找到了进入发散模式的方法，通常更加直接和迅速。但当我们进行散步、洗澡，甚至只是入睡等活动时，我们所有人都会很自然地进入这种模式。当我们发现自己被一个问题卡住，或者即使在我们日常生活的过程中对某种情况感到不确定时，一旦你直接专注于该情况，让事情沉淀下来，并多花一点时间，通常是一个好主意。这样，更多的神经处理就可以发生，通常是在发散模式下，在意识觉察之下进行。"},{"text":"关键在于，神经处理的发生往往需要时间，建立允许我们学习新事物的新神经结构也需要时间。这就是为什么克服拖延症如此重要。克服拖延症最简单的方法是使用番茄工作法；即短暂的25分钟专注集中，随后进行一点精神放松。正是通过练习和重复，我们可以帮助增强和强化我们在学新东西时正在构建的神经结构。对于更抽象的主题，练习和重复尤为重要。"},{"text":"当然，记忆是学习的一个重要方面。我们的工作记忆中有四个槽位。除非我们不断重复，否则事物会从这些槽位中掉落。从这个意义上说，工作记忆就像一块不太好的黑板。另一方面，长期记忆就像一个存储仓库。如果你练习和重复某件事足够多，使其进入长期记忆，通常以后需要时你可以调取它，尽管你可能偶尔需要一点重复来刷新记忆。通过在一整天内多次重复来突击学习，从来不是一个好主意。因为这就像试图通过在一整天内举重来锻炼肌肉。没有足够的时间让坚实的结构生长出来。"},{"text":"我们还了解到睡眠在清除白天活动中产生的毒素方面的重要性。前一晚睡眠不足时，应避免参加考试或做任何困难的事情，因为这就像试图用中毒的大脑去思考。同样重要的是，运动在帮助改善我们的记忆和学习能力方面，其价值令人惊讶。"},{"text":"本周我们在学习过程中玩得很开心，我敢打赌你会发现下周的材料更加令人兴奋。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-10","title":"对接下来内容的期待！玛丽·安·内斯托尔给出特别提示","file":"chapter-010.mp3","sha256":"755498779cf700efa629eadc91123770c6a644e3822af0cce8d59ed2c762e267","paragraphs":[{"text":"大家好，我是玛丽·安，我是《学会学习》课程的教学助理之一。第一个模块马上就要结束了，我想花一分钟时间给大家打打气。"},{"text":"根据我自己的亲身经历，我可以告诉大家，这门课程改变了我学习和复习的方式。在这门课之前，我会很努力地学习，但无论我花多少时间，我都无法记住所学的内容。老实说，我曾以为是我自己有什么问题。然后我上了这门课，才发现真正的问题在于我学习的方式，或者我以为我在学习的方式。这么多年上学，包括本科学位和硕士学位，竟然没有一位老师像这门课里的老师那样，把他们的经验与我们分享。"},{"text":"利用在这门课上学到的技巧，我现在知道如何记住我想要学习的信息。其他课程的参与者有时会在第一周就退出。但在这门课上，千万不要这样做。否则，你将错失一个千载难逢的机会。知道我们如何能有效地学习，是一项每个人都需要掌握的生活技能，无论我们处于人生的哪个阶段。永远都不算太晚。如果你在讨论区看到我，请跟我打个招呼。我非常想听听你们的想法，以及我们如何能互相帮助学习，如何学会学习。"}]},{"key":"ch-11","title":"组块简介","file":"chapter-011.mp3","sha256":"3a52385b01e93d09e9f9022c04e3f12ae8f4350641fc90d9797ec2765d097c5d","paragraphs":[{"text":"本周，我们将讨论组块，即你的大脑可以轻松访问的紧凑信息包。我们将探讨如何形成组块，如何利用它们来加深你对材料的理解并激发创造力，以及组块如何帮助你在考试中取得更好的成绩。我们还将讨论学习中的能力错觉。当你使用低效的学习方法时，你的大脑会被欺骗，误以为自己在学习，而实际上你只是在浪费时间。我们将介绍这些低效的学习方法，并告诉你研究表明哪些方法能更好地帮助你学习。最后，我们将讨论一种叫做过度学习的东西，它可以将信息牢固地植入你的大脑，但也可能有点像在无效地空转时越陷越深。你可以通过交错学习，为学习提供智能的多样性，使你的学习时间更有价值。"},{"text":"我是芭芭拉·奥克利。感谢你学习如何学习。"}]},{"key":"ch-12","title":"什么是组块？","file":"chapter-012.mp3","sha256":"b5d01a2af15f074c975b780205f9c8a4c990730f80ae33eefa7d31d07b52f1fc","paragraphs":[{"text":"在这个视频中，我们将回答一个问题：什么是组块？"},{"text":"当你第一次看到一个全新的概念时，它有时可能没什么意义，就像这里展示的杂乱无章的拼图碎片一样。组块化是一种心理飞跃，它帮助你通过意义将信息碎片结合在一起。这个新的逻辑整体使组块更容易被记住，同时也使组块更容易融入你正在学习的更大图景中。仅仅死记硬背一个事实，而不理解它或没有上下文，并不能帮助你理解真正发生了什么，或者这个概念如何与你正在学习的其他概念结合在一起。请注意，这些拼图碎片上没有相互咬合的边缘来帮助你将其与其他碎片拼接在一起。"},{"text":"我们之前讨论过工作记忆，以及工作记忆的四个槽位似乎位于你大脑前额正后方的一个区域，这个区域被称为前额叶皮层。当你将注意力集中在某事上时，几乎就像你有一只章鱼。这只注意力的章鱼在必要时将它的触手穿过工作记忆的四个槽位，帮助你与你大脑各个部分可能存储的信息建立联系。请记住，这与发散模式的随机联系不同。将注意力集中在连接大脑各部分以将想法串联起来，是专注模式学习的重要组成部分。这也往往是帮助你开始创建组块的关键。有趣的是，当你感到压力时，你的注意力章鱼开始失去建立某些联系的能力。这就是为什么当你愤怒、有压力或害怕时，你的大脑似乎无法正常工作。"},{"text":"从神经科学的角度来说，组块是通过意义或使用而结合在一起的碎片信息。你可以将字母 P-O 和 P 结合成一个易于记忆的概念性组块，即单词 pop。这就像将一个笨重的计算机文件转换为 ZIP 文件。在这个单一的 pop 组块之下，是一首由学会了协调一致的神经元组成的交响乐。这种将我们简化的抽象思维组块联系在一起的复杂神经活动，无论是涉及首字母缩略词、想法还是概念，都是许多科学、文学和艺术的基础。"},{"text":"假设你想学习说西班牙语。如果你是一个在讲西班牙语的家庭环境中长大的孩子，学习西班牙语就像呼吸一样自然。你的妈妈说，mama。然后你立刻回应她，mama。你的神经元放电并连接在一起，形成一个闪烁的思维回路，将声音 mama 和你母亲微笑的脸在你脑海中牢固地联系起来。这个闪耀的神经回路是一个记忆痕迹，当然，它与其他许多相关的记忆痕迹相连。最好的语言学习项目，比如我在其中学习俄语的国防语言研究所的项目，都结合了结构化的练习，包括重复和专注模式下的语言死记硬背，以及更多类似发散模式的与母语者的自由交谈。目标是嵌入基本的单词和模式，以便你能像使用母语一样自由和创造性地使用你的新语言。"},{"text":"事实证明，在学术领域获得专业知识的第一个步骤之一，就是创建概念性组块，即通过意义将分散的信息碎片结合起来的心理飞跃。神经组块的概念也适用于体育、音乐、舞蹈，实际上几乎适用于人类能够擅长的任何事情。基本上，组块意味着一个神经元网络，它们习惯于一起放电，以便你能流畅有效地思考一个想法或执行一个动作。专注的练习和重复，即创建强烈的记忆痕迹，有助于你创建组块。通往专业知识的道路是一点一点建立起来的，小组块可以变成大组块，所有的专业知识都为你逐渐成为材料的大师，从而支持更具创造性的诠释奠定了基础。换句话说，正如你稍后所见，在构建组块时的练习和重复并不是你成为所学材料真正创造性大师所需的一切。组块化帮助你的大脑运行得更高效。一旦你将一个想法、概念或动作组块化，你就不再需要记住所有底层的细微细节。你掌握了主要想法，也就是组块，这就足够了。这就像早上穿衣服。你只需要想一个简单的念头，比如“我要穿衣服”，但当你意识到那一个简单组块思想背后发生的复杂活动漩涡时，你会感到惊讶。接下来，我们将讨论如何形成一个组块。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-13","title":"如何形成组块 – 第一部分","file":"chapter-013.mp3","sha256":"ab3c531d8f826cf23894553f478b6b6ba1a23821a33e919d3cb78d132175b8da","paragraphs":[{"text":"在这个视频中，我们将为你提供一些关于如何形成组块的基础知识。如果你正在学习演奏一首难度较高的吉他曲，你脑海中关于这首曲子的神经表征可以被视为一个相当大的组块。首先，你会聆听这首曲子。也许你甚至会观看别人演奏这首曲子，特别是如果你只是一个初学者，正在学习诸如如何持握吉他这类事情。"},{"text":"对于大多数学科或技能而言，获得你想要掌握的模式的最初感觉是相似的。你通常必须掌握歌曲的小片段，这些片段会成为神经微型组块，随后它们会结合在一起形成更大的组块。例如，在几天之内，你可能会学会如何流畅地在吉他上演奏乐句，当你掌握了这些乐句后，你可以将它们与其他你已学会的乐句连接起来，逐渐将所有部分组合在一起，以便你能演奏整首曲子。在学习一项运动，比如篮球、足球或高尔夫时，你会掌握并精通所需技能的各种片段。你正在创建小的神经微型组块，然后可以逐渐将它们编织成更大的神经组块。后来，你可以将这些较大的组块进一步整合成更大、更复杂的组块，以便在应对例如一个朝你飞来的足球的轻微偏移和旋转时，能够瞬间调取这些组块。"},{"text":"最好的组块是那些根深蒂固到甚至不需要你有意识地去思考如何将神经模式连接在一起的组块。实际上，将复杂的想法、动作或反应转化为单个组块的目的就在于此。你可以在语言学习中看到这一点。在初期，仅仅用恰当的细微差别、语调和口音说出一个单词往往需要大量的练习。将即兴的句子串联起来，需要能够创造性地将新语言中各种复杂的微型组块和组块混合在一起的能力。"},{"text":"为了理解我的意思，试着用印度语言卡纳达语重复以下绕口令。嗨，我是希尔帕·孔卡尼。我是卡纳达语的母语使用者，这是印度最古老的语言之一。今天，我要与你们分享一个卡纳达语的绕口令。那么，让我们开始吧。特里凯雷，伊里马莱，穆鲁卡里，库里马里，梅尤蒂达武。不容易，对吧？除非你是卡纳达语的母语使用者，但这种语言是一点一点学会的。"},{"text":"在数学和科学中的学习涉及相同的方法。当你学习新的数学和科学材料时，通常会给你带有解题过程的示例问题。这是因为，当你最初试图理解如何解题时，你的认知负荷很重。因此，从带有解题过程的示例开始会有所帮助。这就像在尝试自己演奏一首曲子之前先听一遍。解题过程的大部分细节就在那里，你的任务只是弄清楚为什么步骤是这样进行的。它们可以帮助你看到问题的关键特征，并理解问题背后的基本原理。"},{"text":"关于在数学和科学中使用解题示例来帮助你开始形成组块的一个担忧是，人们很容易过于关注单个步骤为何有效，而忽略了步骤之间的连接。也就是说，忽略了为什么这个特定的步骤是你接下来应该做的事情。所以请记住，我在讲解遵循解题过程时，指的不是那种千篇一律、照章办事、毫无头脑的方法。这更像是在前往一个新地方旅行时使用地图。在使用地图时，注意你周围发生的事情，很快你就会发现自己能够独自到达那里。你甚至能够找到到达那里的新途径。"},{"text":"接下来，我们将带你了解组块形成的实际步骤。我是芭芭拉·奥克利。感谢学习如何学习。"},{"text":"#嘿，小女孩，有时候日子会变难，但很快#暴风雨就会过去，你会在院子里玩耍。#嘿，小女孩，有时候你可能会感到悲伤，但总有#一天你会意识到事情其实没那么糟。这只是成长的一部分。#"}]},{"key":"ch-14","title":"如何形成组块 – 第二部分","file":"chapter-014.mp3","sha256":"bceac8b718e842e9f54221c1126bc84372a0f573993adbb001defc4e1c6822d0","paragraphs":[{"text":"在这个视频中，我将带你了解形成组块的基本步骤。每个学科都略有不同。例如，在历史学科中形成组块，与在化学或空手道中形成组块是相当不同的。在这里的解释中，我会稍微侧重于解释思维观念的组块，而不是身体动作的组块。但你会看到，这两种方法是紧密相关的。所以，无论你是在学习某种思维内容还是某种身体动作，你都会在这里找到一些有用的想法。"},{"text":"形成组块的第一步，就是将你全神贯注的注意力集中在你想要组块的信息上。如果背景里开着电视，或者你每隔几分钟就抬头查看或回复手机或电脑上的信息，这意味着你在形成组块时会遇到更多困难，因为你的大脑并没有真正专注于对新材料进行组块。当你刚开始学习某样东西时，你正在建立新的神经模式，并将它们与遍布大脑许多区域的既有模式连接起来。打个比方，你的章鱼触手如果有一部分在思考其他事情，占用了你工作记忆中有限的部分，它们就无法很好地伸展。"},{"text":"形成组块的第二个步骤是理解你试图组块的基本观念，无论是理解像大陆漂移这样的概念，看到故事情节基本要素之间的联系，掌握供需这一经济原理，还是理解某一类数学问题的本质。学生通常能够自然地综合出大意；也就是说，找出主要观念。或者至少，如果他们允许专注模式和发散模式轮流帮助他们弄清楚发生了什么，他们就能掌握这些观念。理解就像一种强力胶，有助于将底层的记忆痕迹粘合在一起。它创造出广泛包罗的痕迹，这些痕迹可以与其他记忆痕迹相连。如果你不理解，能形成组块吗？可以，但通常这是一个无用的组块，无法与你学习中的其他材料契合或关联。话虽如此，重要的是要认识到，仅仅理解一个问题是如何被解决的，例如，并不一定会形成一个你以后能轻易回想起来的组块。不要把理解上的突破带来的“啊哈！”时刻，与扎实的专长混淆。这就是为什么当老师在课堂上讲解一个观念时，你能掌握它，但如果你没有在初次学习后不久进行复习，到了准备考试的时候，它可能会变得难以理解。在数学和科学相关学科中，合上书本，测试你自己是否能解决你认为自己理解的问题，会加速你在这个阶段的学习。你通常会发现，第一次真正理解某事的时候，就是当你能够自己实际做到的时候。在许多学科中也是如此，仅仅看别人的画作并不意味着你能自己创作出那幅画，仅仅听一首歌也不会赋予你以同样共鸣的方式演唱它所需的专长。仅仅因为你看到了它，甚至因为你理解了它，并不意味着你真的能做到。只有亲自去做，才有助于创造支撑真正精通的神经模式。"},{"text":"形成组块的第三个步骤是获得情境，这样你不仅能看到如何，还能看到何时使用这个组块。情境意味着超越初始问题，更广泛地看待，通过重复和练习相关和不相关的问题，这样你不仅能看到何时使用这个组块，还能看到何时不使用它。这有助于你看到新形成的组块如何融入更大的图景。换句话说，你可能在策略或问题解决工具箱中有一个工具，但如果你不知道何时使用那个工具，它对你不会有多大帮助。最终，练习有助于拓宽与你组块相连的神经元网络，确保它不仅牢固，而且可以从许多不同的路径访问。正如你从这张自上而下、自下而上的插图中看到的，学习以两种方式发生。有一种自下而上的组块过程，练习和重复可以帮助你构建和加强每个组块，以便你随时需要时都能轻松访问。还有一种自上而下的宏观过程，让你看到你在学什么以及它在哪里。这两种过程对于掌握材料都至关重要。情境是自下而上和自上而下学习交汇的地方。在这里澄清一下，组块可能涉及你学习如何使用某种问题解决技术。情境意味着学习何时使用该技术而不是其他技术。在开始学习一章之前，花两分钟快速浏览书中的图片，瞥一眼图片和章节标题，可以让你获得一种宏观的感觉。听一场组织得非常好的讲座也可以。这些活动可以帮助你了解你正在构建的组块应该放在哪里，组块之间如何相互关联，正如你在这里看到的，那个坐在车里的人的图像。先学习主要概念或要点。这些通常是一个好的讲师或书章节大纲、流程图、表格或概念图的关键部分。一旦你完成了这一步，再填充细节。即使在你学习结束时还有几块拼图缺失，你仍然能看到宏观图景。就是这样！"},{"text":"总结一下，组块最好通过专注的注意力、对基本观念的理解，以及帮助你获得精通和宏观情境感的练习来构建。这些是形成组块并将该组块融入你所学习内容的更大概念概览中的基本步骤。但还有更多。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-15","title":"能力错觉","file":"chapter-015.mp3","sha256":"996a832dd94f97a47265febabf7827a857c8a6764e11de100c9c34854f6f76c9","paragraphs":[{"text":"在这个视频中，我们将讨论一些让学习步入正轨的重要理念。包括回忆的重要性，学习中的能力错觉，微型测试，以及犯错误的价值。"},{"text":"尝试从书本或笔记中学习材料的最常见方法之一，就是简单地重读。但心理学家杰弗里·卡皮克（Jeffrey Karpicke）表明，这种方法实际上比另一种非常简单的技术——回忆——要低效得多。在阅读完材料后，只需移开视线，看看你能回忆起刚才读过的内容中的什么。卡皮克发表在《科学》期刊上的研究，为此提供了确凿的证据。学生们学习了一篇科学文本，然后通过尽可能多地回忆信息来练习。然后他们重新学习该文本并再次回忆。也就是说，他们尝试再次记住关键思想。结果表明，在相同的时间内，通过简单地练习和回忆材料，学生学到的东西远多于使用任何其他方法，包括简单地重读文本多次，或者绘制概念图，后者据称能丰富所研究材料中的关系。"},{"text":"无论学生参加正式测试，还是只是非正式地自我测试，这种学习效果的提升都会发生。这提供了一个重要的提醒。当我们检索知识时，我们并不是无意识的机器人。检索过程本身增强了深度学习，并帮助我们开始形成组块。这几乎就像回忆过程帮助建立了一些小的神经挂钩，我们可以将思维挂在上面。更让研究人员感到惊讶的是，学生自己预测，简单地阅读和回忆材料并不是最好的学习方式。他们认为，概念映射，即绘制显示概念之间关系的图表，才是最好的。但如果你试图在基本组块嵌入大脑之前建立组块之间的连接，效果并不好。这就像在你甚至不理解棋子如何移动的基本概念之前，就试图学习国际象棋的高级策略。使用回忆，即对关键思想的心理检索，而不是被动地重读，将使你的学习时间更加专注和有效。重读文本似乎有效的唯一时间，是如果你在重读之间让时间流逝，使其成为一种间隔重复的练习。"},{"text":"思考这种类型学习和回忆的一种方式，就展示在这里。正如我们之前提到的，工作记忆中有大约四个槽位。当你最初学习如何理解一个概念，或解决某个问题的技巧时，你的整个工作记忆都参与了这个过程。正如这种工作记忆四个槽位之间混乱纠缠的连接所示。当你开始将概念组块化时，你会感觉到它在你的脑海中连接得更加容易和顺畅。一旦概念被组块化，它在工作记忆中只占用一个槽位。它同时变成了一条容易跟随和用于建立新连接的平滑线索。你工作记忆的其余部分保持清晰。这条悬挂的组块化材料线索，在某种意义上，增加了你工作记忆可用的信息量。这就像工作记忆中的槽位是一个连接到巨大网页的超链接。"},{"text":"现在你明白了，为什么由你自己来解决问题或掌握概念是关键。而不是由编写你所学习任何主题的答案手册或书籍的人来做。如果你只是看答案，例如，然后告诉自己。哦，是的，我明白他们为什么那样做。那么答案并不是真正属于你的。你几乎什么都没做，来将这些概念编织进你自己的底层神经回路。仅仅瞥一眼答案并认为你真正知道它，是学习中常见的能力错觉之一。如果你想充分掌握材料，以便在考试中取得好成绩并创造性地思考它，你必须让信息持续存在于你的记忆中。相关的是，你可能会惊讶地发现，高亮和划线必须非常小心地进行。否则，它不仅可能无效，还可能具有误导性。这就像，用手做很多动作可能会欺骗你，让你认为你已经将概念放进了大脑。如果你确实要在文本上做标记，试着在标记之前寻找主要思想。并试着将划线或高亮降到最低。每段不超过一句话。"},{"text":"另一方面，在页边空白处写下综合关键概念的词语或笔记是一个非常好的主意。杰夫·卡皮克，这位在回忆相关领域做了如此重要工作的同一位研究者，也研究了相关主题。学习中的能力错觉。学生喜欢不断重读笔记或教科书的原因，是当他们把书或谷歌浏览器打开在面前时，它提供了一种材料也在他们大脑中的错觉。但事实并非如此，因为看书比回忆更容易，学生坚持他们的错觉，以一种并不非常有效的方式学习。这是一个提醒，仅仅想要学习材料，并花大量时间与之相处，并不能保证你真正学会了它。确保你在学习而不是被能力错觉欺骗的一个超级有帮助的方法，是对你所学的任何内容进行自我测试。在某种意义上，这就是回忆实际在做的事情。让你看到你是否真正掌握了一个想法。如果你在做的事情中犯了错误，这实际上是一件非常好的事。你当然想尽量不重复你的错误，但在高风险的真实测试之前，在你的小自我测试中犯错非常有价值。因为它们允许你逐步修复你思维中的缺陷，错误帮助纠正你的思维，以便你学得更好，表现更好。"},{"text":"你现在知道，回忆是一个强大的工具。但这里还有另一个提示，在你通常的学习场所之外回忆材料，也可以帮助你加强对材料的掌握。你没有意识到，但当你学习新东西时，你经常会在最初学习材料时，无意识地吸收房间和周围空间的线索。这可能会在你参加考试时让你分心，因为你经常在与你学习时不同的房间参加考试。通过在不同的物理环境中回忆和思考材料，你变得独立于任何特定位置的线索。这有助于你避免考试房间与你最初学习材料的地方不同的问题。"},{"text":"我是芭芭拉·奥克利，感谢学习如何学习。"}]},{"key":"ch-16","title":"什么在激励你？","file":"chapter-016.mp3","sha256":"2a2f9d640a36174a969875f8801d67a98041174ef05d60daa42695cde60304ee","paragraphs":[{"text":"欢迎回来！当你不感兴趣的时候，学习是很困难的。但如果这是你真正感兴趣的事情，学习就会变得容易。这是为什么呢？"},{"text":"你大脑皮层中的大多数神经元携带着关于你周围正在发生什么以及你正在做什么的信息。你的大脑还有一套弥散投射的神经调质系统，它们携带的信息不是关于体验的内容，而是关于体验对你未来的重要性和价值。神经调质是化学物质，它们影响一个神经元如何响应其他神经元。今天我们将讨论其中的三种：乙酰胆碱、多巴胺和血清素。"},{"text":"乙酰胆碱神经元与大脑皮层形成神经调质连接，这对于专注学习尤为重要，也就是当你全神贯注的时候。这些乙酰胆碱神经元广泛投射，并激活控制突触可塑性的回路，从而形成新的长期记忆。神经调质还会对你的潜意识产生深远的影响。"},{"text":"在我的一生中，大脑领域最伟大的发现之一，就是我们的动机受一种名为多巴胺的特定化学物质控制。多巴胺存在于我们脑干中一小群神经元中，这里用橙色标出。这些多巴胺神经元是一个控制奖励学习的大型大脑系统的一部分，特别是在基底神经节中，它位于多巴胺神经元上方、大脑顶部皮层下方的绿色区域。当我们获得意外的奖励时，这些神经元会释放多巴胺。多巴胺信号广泛投射，对学习有非常强大的影响。这也影响决策，甚至影响感觉输入的价值。"},{"text":"多巴胺的作用是预测未来的奖励，而不仅仅是即时的奖励。这可以激励你去做一些现在可能没有回报，但未来会带来更好回报的事情。成瘾性药物人为地增加多巴胺活性，欺骗你的大脑，让它认为刚刚发生了一件美妙的事情。事实上，恰恰相反。这会导致渴望和依赖，从而劫持你的自由意志，并激励那些对你有害的行为。多巴胺神经元的丧失会导致缺乏动力，以及一种叫做快感缺失的现象，即对曾经给你带来快乐的事情失去兴趣。多巴胺神经元的严重丧失会导致静止性震颤、动作迟缓、僵硬，这被称为帕金森病。最终，这会导致木僵，即完全缺乏任何运动。多巴胺神经元是你大脑中潜意识部分的一部分，你在第一周已经了解过。当你承诺在学完一个组块后奖励自己时，你就是在利用你的多巴胺系统。"},{"text":"血清素是第三个弥散神经调质系统，它强烈影响你的社交生活。在猴群中，阿尔法雄性猴子的血清素活性水平最高，而排名最低的雄性猴子血清素水平最低。百忧解，一种用于治疗临床抑郁症的药物，会提高血清素活性水平。血清素水平也与冒险行为密切相关，血清素较低的猴子风险更高。因暴力犯罪而入狱的囚犯，其血清素活性水平在社会中属于最低之列。"},{"text":"最后，正如你深知的，你的情绪强烈地影响着学习。情绪曾经被认为与认知是分开的，但最近的研究表明，情绪与感知和注意力交织在一起，并与学习和记忆相互作用。杏仁核，一个这里展示的杏仁状结构，位于大脑底部，是认知和情绪有效整合的主要中心之一。杏仁核是边缘系统的一部分，它与海马体一起参与记忆处理和决策，以及调节情绪反应。为了成为一个有效的学习者，你需要让你的杏仁核保持愉悦。情绪和你的神经调质系统比感知和行动要慢，但对于成功的学习来说，它们并不因此变得不那么重要。"},{"text":"如果你想更多地了解乙酰胆碱、多巴胺和血清素，请在 www.brainfacts.org 上查找，这是一个充满了关于你大脑的有价值事实的网站。"},{"text":"我是特里·塞诺夫斯基。祝学习愉快，我们下次再见。"}]},{"key":"ch-17","title":"组块图书馆的价值","file":"chapter-017.mp3","sha256":"6bc10e22145105ff7bd2ff6000694291633748602eff5559cb1f76485d2ee7da","paragraphs":[{"text":"以新颖且原创的方式组合组块的能力，是许多历史创新的基础。比尔·盖茨和其他行业领袖会留出长达一周的专门阅读时间，以便在一段时间内将许多多样化的想法保持在脑海中。这有助于通过让那些新鲜且尚未被遗忘的想法在彼此之间建立网络联系，从而激发他们自己的创新思维。基本上，人们为了增强知识并获取专业知识，所做的就是逐渐增加他们脑海中的组块数量。这些有价值的信息片段，他们可以用新颖且富有创造性的方式拼凑起来。例如，国际象棋大师可以轻松调取数千种不同的棋局模式。音乐家、语言学家和科学家也都能各自调取他们各自学科中类似的组块知识。无论你在学什么，你的组块化心智图书馆越大、练习得越熟练，你就越能轻松地解决问题并找出解决方案。正如我们很快将发现的，组块化并不是你在培养学习中的创造性灵活性时所需要的全部。但它是一个重要的组成部分。"},{"text":"组块也能帮助你理解新概念。这是因为，当你掌握了一个组块，你会发现这个组块可以以令人惊讶的方式与相似的组块产生关联，不仅是在该领域内，也是在非常不同的领域中。这个概念被称为迁移。例如，你为物理学学习到的概念和问题解决方法，可能与商业领域的组块化概念非常相似。我发现，语言学习的某些方面，在我后来开始学习计算机编程时，对我非常有帮助。"},{"text":"组块是一种将信息压缩得更加紧凑的方式。随着你在特定学科中组块化经验的增加，你会看到你能创建的组块变得更大。从某种意义上说，那些丝带变得更长了。不仅那些丝带更长了，而且神经模式在某种意义上也更深了。它们更加坚实，更加根深蒂固。如果你拥有一个将概念和解决方案内化为组块化模式的图书馆，你可以把它想象成一组或一个神经模式的图书馆。当你试图弄清楚某事时，如果你拥有这些组块的良好图书馆，通过隐喻来说，你可以更容易地通过聆听你发散模式中的低语，直接跳到正确的解决方案。你的发散模式可以帮助你以新的方式将两个或更多组块连接起来，以解决新颖的问题。另一种思考方式是：随着你构建每个组块，它都在填充你更大知识图景的一部分。但如果你不练习你不断增长的组块，它们可能会保持模糊，这就更难拼凑出你试图学习的大图景。"},{"text":"在构建组块化图书馆时，你正在训练你的大脑不仅识别特定的概念，还识别不同类型的概念类别，以便你能自动知道如何快速解决或处理你遇到的任何事物。你将开始看到简化问题解决的图案，并很快发现不同的解决技巧潜伏在你记忆的边缘。在期中考试或期末考试之前，通过复习，很容易让这些解决方案在脑海中随时待命。"},{"text":"弄清楚某事或解决问题有两种方式。首先是逐步的序列推理，其次是通过更整体的直觉。序列思维，其中每个小步骤都刻意导向一个解决方案，涉及专注模式。另一方面，直觉往往需要这种创造性的发散模式，将几个看似不同的专注模式想法联系起来。大多数困难的问题和概念是通过直觉掌握的，因为这些新想法会跳出你熟悉的事物。请记住，发散模式半随机地建立联系的方式意味着，它们提供的解决方案应该使用专注模式进行非常仔细的验证。直觉的洞察并不总是正确的。你可能认为，仅在你所学习内容的单个部分或章节中，就有如此多的问题和概念，根本没有办法全部学会。这就是机遇法则发挥作用的地方。幸运女神眷顾尝试者。只需专注于你正在学习的任何部分。你会发现，一旦你将第一个问题或概念放入你的心智图书馆，无论它是什么，那么第二个概念就会更容易进入。第三个则更加容易。这并不是说这一切都轻而易举，但它确实变得更容易了。"},{"text":"我是芭芭拉·奥克利。感谢你学习关于学习的内容。"}]},{"key":"ch-18","title":"过度学习、紧张失常、定势效应与交错练习","file":"chapter-018.mp3","sha256":"2f4a83c59000bec1ce71128037f1398d0236c7fed5af74f6f82c2e4168e1cd28","paragraphs":[{"text":"当你学习一个新概念时，例如一个新词汇、一个新概念或一种新的解题方法，你有时倾向于在同一次学习过程中反复练习它。少量的重复是有用且必要的，但一旦你在这次学习过程中已经掌握了你能掌握的内容，继续学习或练习就被称为过度学习。"},{"text":"过度学习有其存在的价值。它能产生一种自动化反应，这在打网球发球或演奏完美的钢琴协奏曲时可能非常重要。如果你在考试或公开演讲时容易紧张失常，过度学习就特别有价值。你知道即使是经验丰富的公开演讲者，通常也要为一次典型的二十分钟TED演讲练习大约七十个小时吗？自动化反应在紧张时刻确实有帮助，但要警惕在单次学习过程中进行重复性的过度学习。研究表明，这可能是对宝贵学习时间的浪费。事实是，一旦你在这次学习过程中掌握了基本概念，继续在同一次过程中死磕它，并不能强化你希望强化的那种长期记忆连接。更糟糕的是，专注于一种技术有点像只通过练习使用锤子来学习木工。过一段时间后，你会以为只要用力敲打就能修好任何东西。"},{"text":"在随后的学习过程中重复你正在尝试学习的内容是完全没问题的，而且通常很有价值。它可以强化并深化你的组块化神经元模式。但要小心；重复你已经完全掌握的东西，说实话，很容易。它也可能带来一种能力的错觉，让你以为你已经掌握了全部材料，而实际上你只掌握了容易的部分。相反，你希望有意识地专注于你发现更困难的内容来平衡你的学习。这种专注于更困难材料的做法被称为刻意练习。这往往是优秀学生和杰出学生之间的区别所在。"},{"text":"这一切也与一个被称为定势效应的概念有关。在这种现象中，你最初的简单想法，即你脑海中已有的想法或你已经建立并强化的神经模式，可能会阻止更好的想法或解决方案被发现。我们在专注模式的弹珠台图片中看到了这一点，其中你最初的思维弹珠滚向了大脑的上部，但解决问题的思维模式却在下部。专注模式中拥挤的弹珠台挡板和你之前建立的模式可能会形成一种沟槽，阻止你弹跳到可能找到解决方案的新位置。"},{"text":"顺便说一下，德语单词“Einstellung”意为心态。基本上，你可以把定势效应记作设置路障，因为这是由你最初看待事物的方式造成的。这种错误的方法在体育和科学中特别容易发生，更不用说其他学科了，因为有时你对正在发生的事情或你需要做什么的初始直觉是具有误导性的。你必须在同时学习新观念或方法的同时，摒弃你错误的旧观念或方法。"},{"text":"学生在学习时有时犯的一个重大错误是在学会游泳之前跳进水里。换句话说，他们盲目地开始做作业，而不阅读教科书、不听课、不观看在线课程，甚至不与有知识的人交谈。这是注定失败的做法。这就像在专注模式的弹珠台机器中，随机让一个想法弹开，而不真正关注解决方案真正所在的地方。理解如何获得真正的解决方案在学习和生活中都很重要。"},{"text":"掌握一门新学科意味着不仅要学习基本的组块，还要学习如何选择和使用不同的组块。学习这一点的最佳方法是通过练习在需要不同技术或策略的问题或情境之间来回跳跃。这被称为交错练习。一旦你在你的学习过程中掌握了技术的基本概念，有点像学习骑自行车时带着辅助轮，开始将你的练习与不同类型的问题或不同类型的思路、概念、程序交错进行。有时这做起来可能有点困难。例如，书中给定的章节通常专门针对一种特定技术，所以当你翻到该章节时，你已经知道你将使用哪种技术。尽管如此，尽你所能混合你的学习内容。"},{"text":"特别是在科学和数学中，向前看有时在章节末尾找到的更多样化的问题集会有所帮助。或者你可以有意识地尝试偶尔挑选出为什么一些问题需要一种技术而不是另一种技术。你希望你的大脑习惯于这样一个想法：仅仅知道如何使用某个特定的概念、方法或解题技术是不够的。你还需要知道何时使用它。交错你的学习，例如，在复习考试时，有意识地通过不同章节和材料中的问题来回跳跃，有时可能会让你的学习看起来有点更困难，但实际上，它帮助你学习得更深入。"},{"text":"交错练习极其重要。虽然练习和重复对于帮助建立坚实的神经模式以供调用很重要，但正是交错练习开始培养灵活性和创造力。这是你离开练习和重复的世界，开始更独立地思考的地方。当你在一个学科或一个领域内进行交错时，你开始在该领域内发展你的创造力。当你在几个学科或领域之间进行交错时，你可以更容易地在不同领域的组块之间建立有趣的新联系，这可以进一步增强你的创造力。当然，在不同领域发展坚实的知识组块需要时间，所以有时存在权衡。在几个领域发展专业知识意味着你可以将一个领域非常新的想法带到另一个领域，但这也可能意味着你在一个或另一个领域的专业知识不如只专注于一个学科的人那么深。另一方面，如果你只在一个领域发展专业知识，你可能对它了解得非常深入，但你可能更深刻地陷入你熟悉的思维方式，而无法处理新想法。"},{"text":"科学哲学家托马斯·库恩发现，科学中大多数范式转移是由年轻人或最初受过不同学科训练的人带来的。他们不容易被定势效应所困，即由于他们之前的训练而受阻的思维。当然，还有那句老话，科学是随着一场场葬礼而前进的，因为那些固守旧有看待事物方式的人逐渐死去。"},{"text":"最后，不要犯这样一个错误，认为学习只发生在你从老师或书本中获取的那些学科中。当你教一个孩子如何有效地应对霸凌者，或者你修理一个漏水的水龙头，或者你快速为去香港的商务旅行打包一个小行李箱，所有这些例子都说明了学习的重要方面的成果。物理学家理查德·费曼在食堂里看到有人把餐盘抛向空中，这启发了他获得诺贝尔奖的工作。电视节目《脏活》和《总得有人干》中的迈克·罗展示了学习在各种不同的非学术领域中是多么重要和令人兴奋。"},{"text":"我是芭芭拉·奥克利。感谢你们学习关于学习的内容。"}]},{"key":"ch-19","title":"第二周总结","file":"chapter-019.mp3","sha256":"ffc091d9023dfa61fc045b11c92cee09088893a0a6df24fac235be8b9076a6b5","paragraphs":[{"text":"在这个视频中，我将综合本周视频中的主要观点。换句话说，我们将对“组块”这一周的内容进行组块。我们开始吧："},{"text":"从神经科学的角度来说，组块是通过使用以及通常通过意义而结合在一起的信息片段。你可以把组块想象成一个闪闪发光的神经元网络，它紧凑地综合了关键的想法或动作。"},{"text":"组块可以变得更大、更复杂。但与此同时，它们是一个单一且易于访问的项目，你可以像把丝带插入插槽一样，把它放入你的工作记忆中。"},{"text":"组块最好通过专注、不分心的注意力、对基本概念的理解以及练习来构建，这些练习有助于加深你的模式，并帮助你获得宏观背景。"},{"text":"简单的回忆，即在不看页面的情况下尝试记住要点，是促进组块过程的最佳方式之一。它似乎有助于建立神经挂钩。它们帮助你更好地理解材料。还试着在与你最初学习材料不同的地方回忆材料，这样它就能更深刻地扎根并变得可访问，无论你在哪个房间。这对考试非常有帮助。"},{"text":"迁移是指，你在一个领域掌握的组块，通常能帮助你更容易地学习不同领域的信息组块，这些领域之间可能有着惊人的共同点。"},{"text":"通过在一次会话中练习你选择的不同概念、方法和技巧来交错学习。组块非常重要，但它们并不一定建立灵活性，而灵活性对于成为你所学习材料的专家同样重要。"},{"text":"学习中的能力错觉——学会识别你何时在自欺欺人，关于你是否真的在学习材料。经常测试自己。使用小型迷你测试来查看你是否真的在学习材料，还是你一直在自欺欺人，以为自己在学，实际上并没有。回忆实际上是一种迷你测试。尽量避免过度依赖高亮标记，因为它可能会欺骗你，让你以为材料进入了你的大脑，而实际上并没有。"},{"text":"在学习时犯错是一件好事。它们让你能够捕捉到能力错觉。避免只练习容易的内容，因为这可能会带来你已经掌握材料的错觉。"},{"text":"刻意练习你发现更困难的内容，以完全掌握材料。"},{"text":"定势效应是指，你的初始想法、你已经想到的一个想法，或者你已经充分发展并强化的一个神经模式，阻止了更好的想法或解决方案被发现。或者使你不够灵活，无法接受新的、更好的或更合适的解决方案。机遇法则是有帮助的——幸运女神眷顾尝试者。只需挑出一件小事来学习，然后再挑一件。只要不断尝试，你就会对结果感到惊喜。"},{"text":"我是芭芭拉·奥克利。感谢你们学习关于学习的内容。"}]},{"key":"ch-20","title":"拖延与记忆简介","file":"chapter-020.mp3","sha256":"c9db72ea903b4bc1e0cbf17c6e7995dba1bb34224f97f20c35e5119919dbff07","paragraphs":[{"text":"本周我们将讨论两个看似不同的概念：拖延和记忆。但这两个主题密切相关。为什么？因为构建稳固的长期记忆组块——那些能够被短期记忆轻松访问的组块——需要时间。这不是那种你愿意拖到最后一刻才去处理的事情。你已经拥有一个应对拖延的好工具：番茄工作法。那是充满活力的专注模式下，强大的25分钟集中时段。本周我们将为你提供更多关于拖延是如何发生的，以及应对它的简单方法的信息。这是关键所在：这些方法不需要消耗太多意志力。然后，我们将继续探讨一些访问大脑最强大的长期记忆系统的最佳方式。"},{"text":"我是芭芭拉·奥克利。感谢大家学习如何学习。"}]},{"key":"ch-21","title":"应对拖延症：它比你想象的更容易，也更有价值","file":"chapter-021.mp3","sha256":"7d83851b81c053e2a6f9409bfddb3589c79f3aa255ca6779c4e7827d5b520637","paragraphs":[{"text":"砒霜具有极强的毒性。在发现现代检测方法之前的几个世纪里，谋杀者发现砒霜是一种非常受欢迎的毒物。因此，你可以想象一下，在1875年德国艺术与科学协会第48次会议上，当两名男子坐在观众席前排，一口气喝下超过致死剂量两倍的砒霜时，现场是多么震惊。第二天，这两名男子又回到了会议现场，面带微笑，身体健康。一个人如何能够摄入如此有害的物质却仍然存活，甚至在微观层面身体受到损害的情况下看起来依然健康？这个答案与拖延症有着一种不可思议的联系，这正是我们在接下来几个视频中要讨论的内容。"},{"text":"你已经学会了一个应对拖延症的实用工具，那就是番茄工作法，即25分钟不间断的专注时间，随后进行短暂的放松。本周我们将学习更多。了解一点关于拖延症的认知心理学，就像了解毒物的化学性质一样，可以帮助我们开发出健康的预防措施。在这些视频中，我将教你一种“懒人”应对拖延症的方法。这意味着你将了解你内心的“僵尸”——即你的大脑因特定线索而陷入的常规、习惯性反应。这些僵尸反应往往专注于让当下变得更好。你会看到，当你需要时，可以欺骗其中一些僵尸来帮助你抵御拖延。"},{"text":"并非所有的拖延都是坏的。即使你在处理拖延方面已经做得相当不错，你在这里也能学到一些有用的见解，从而更好地优先安排你的学习。学习避免拖延之所以如此重要，是因为良好的学习是一种循序渐进的活动。你要避免临时抱佛脚，因为这无法建立稳固的神经结构。通过投入相同的时间进行学习，但通过更早开始来拉开学习间隔，你会学得更好。首先，我们要从基础开始。"},{"text":"与容易陷入的拖延不同，意志力很难获得。意志力会消耗大量的神经资源。除非绝对必要，否则你不应该把意志力浪费在抵御拖延上。最好的是，正如你将看到的，你根本不需要这样做。如果你还记得，我们拖延的是那些让我们感到些许不适的事情。当你思考某件你特别不喜欢的事情时，你大脑的疼痛中心就会亮起，于是你会转移并缩小注意力焦点，转向更令人愉悦的事情。这会让你感觉好一些。至少是暂时如此，但遗憾的是，习惯性回避的长期影响可能很糟糕。当你推迟学习时，思考学习本身可能会变得更加痛苦。你可能会在考试中发挥失常，因为你没有奠定牢固的神经基础，无法对材料感到从容。"},{"text":"拖延症可能是一个单一但极其重要的关键性坏习惯，换句话说，是一个影响你生活中许多重要领域的习惯。如果你在这一领域提高了能力，许多其他积极的变化将逐渐开始展开。拖延症与成瘾有共同特征。它提供暂时的兴奋感，并让你从有时枯燥的现实中得到解脱。例如，你很容易欺骗自己，认为利用任何给定时刻的最佳方式是浏览网络获取信息，而不是真正阅读教科书或做指定的习题。你开始给自己讲故事。例如，你可能会告诉自己，有机化学需要特殊的推理能力，而这正是你的弱点，所以当然你在这门课上表现得很差。你会想出一些听起来表面上合理但实际上不合理的借口，比如“如果我在考试前学习得太超前，我就会忘记这些材料”。如果你深受拖延困扰，你甚至可能开始告诉自己，拖延是一种与生俱来、不可改变的特征。毕竟，如果拖延很容易解决，你难道到现在还没有解决它吗？"},{"text":"然而，随着你学业的深入，控制拖延变得越加重要。早年有效的习惯可能会反过来伤害你。在接下来的几个视频中，我将向你展示如何成为你习惯的主人。应该是你在做决定，而不是那些善意但缺乏思考的“僵尸”，也就是你的习惯。正如你将看到的，应对拖延的策略很简单。只是有时候它们并不直观明显。"},{"text":"所以，让我们回到开启本视频的那个故事。那些吃砒霜的人是从极小剂量的砒霜开始的。在极小剂量下，砒霜似乎无害。你甚至可以建立起对其效应的免疫力。这可以让你摄入更大的剂量并看起来健康，即使毒素正在缓慢增加你患癌症的风险并破坏你的器官。同样地，拖延者只是推迟那一点点小事。他们一次又一次地这样做，逐渐习惯它。他们甚至可能看起来健康，但长期影响呢？并不好。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-22","title":"到处都是僵尸","file":"chapter-022.mp3","sha256":"4e4faa727a0695c70614538fcc6fd072ed8f50f4bc69159b8fcc7ec991c01f21","paragraphs":[{"text":"想象一下，你人生中第一次从车道倒车出去。对你们中的一些人来说，这可能听起来是一件相当令人兴奋的事。第一次做这件事时，你会处于高度警觉状态。向你涌来的大量信息会让这项任务看起来几乎不可能完成。但是，一旦你把如何从车道倒车组块化，你只需要想，让我们开始吧。然后，你就出发了。你的大脑进入了一种类似僵尸模式的状态，在这种状态下，它只对几个关键因素保持半意识，而不是被所有数据淹没。骑自行车也是同样的道理。起初，它真的很难，后来就变得容易了。"},{"text":"从神经科学的角度来说，组块与习惯有关。习惯对我们来说是一种节能方式。它允许我们将大脑解放出来，用于其他类型的活动。你进入这种习惯性的僵尸模式的频率，可能比你想象的要高得多。这就是习惯的意义所在，你在执行习惯时，不需要以专注模式去思考你在做什么。它节省了能量。习惯可以是好的，也可以是坏的。它们可以是短暂的，比如心不在焉地往后拨头发。或者它们可以是长期的，例如当你下班回家后散步，或者看电视几个小时。"},{"text":"你可以把习惯看作由四个部分组成。第一个是提示。这是启动你进入僵尸模式的触发器。提示可能简单到只是看到待办事项清单上的第一项。是时候开始下周的家庭作业了。或者看到朋友发来的短信。是时候停止工作了。提示本身既无益也无害；关键在于例程。我们对那个提示的反应，也就是我们所做的事情，才是重要的。"},{"text":"第二个——例程。这是你的僵尸模式。这是你的大脑在接收到提示时，习惯性地落入的例行反应。僵尸反应可能是有用的，无害的，或者有时是有害的。"},{"text":"第三个，奖励。每个习惯之所以形成并持续，是因为它奖励了我们。它给我们一种即时的、小小的愉悦感。拖延是一个很容易养成的习惯，因为奖励，即将大脑的注意力转移到更令人愉悦的事情上，发生得如此迅速和容易。但好习惯也可以得到奖励。找到奖励良好学习习惯的方法，对于摆脱拖延症很重要。"},{"text":"第四个——信念。习惯之所以有力量，是因为你对它们的信念。例如，你可能觉得你永远无法改变你拖延学习直到一天晚些时候的习惯。要改变一个习惯，你需要改变你底层的信念。"},{"text":"我是芭芭拉·奥克利，感谢你们学习如何学习。"}]},{"key":"ch-23","title":"乘风破浪：过程与结果","file":"chapter-023.mp3","sha256":"c853b39f5487a33ecc2c20d01bd9c842b593a360f0ae8b70f37b069b1ba0bc94","paragraphs":[{"text":"在学习过程中变得高效的最佳方式之一，是利用心理工具和技巧来激发和激励自己。首先，就一般的学习而言，你应该意识到，在开始一次学习时产生一些负面情绪是完全正常的。即使是你平时喜欢的科目，关键在于你如何处理这些情绪。研究人员发现，不拖延的人会将消极的想法放到一边，对自己说些诸如“别再浪费时间了，直接开始吧，一旦你开始行动，你就会感觉好起来”之类的话。如果你发现自己因为某些任务让你感到不舒服而回避它们，你应该知道还有另一种重新构建视角的有益方法。那就是学会专注于过程，而不是结果。"},{"text":"过程指的是时间的流逝，以及与这种时间流逝相关的习惯和行动。例如，我打算花二十分钟来工作。结果则是一种产出，例如你需要完成的一项家庭作业。为了防止拖延，你要避免专注于结果。相反，你的注意力应该放在建立过程上。过程与简单的习惯有关，这些习惯恰好能让你完成那些需要做的不愉快任务。例如，假设你不喜欢做某一门课的作业。于是你推迟了做这项作业。你心想只有五个问题，这能有多难呢？但在内心深处，你意识到回答这五个问题可能是一项非常耗时的工作。生活在一种幻想世界中更容易，在这种世界里，那五个问题，或者十页的报告，或者别的什么，都可以在最后一刻完成。你的挑战在于避免专注于结果，即问题的答案。结果正是触发痛苦并导致你拖延的因素。相反，你需要专注于过程——也就是在几天甚至几周内回答问题或为考试做准备所需的那些小段时间。谁在乎你是否在单次学习中完成了作业或掌握了关键概念呢。重点在于，你平静地在短时间内付出最好的努力。"},{"text":"现在谈谈过程。注意在这张图片中，物理学家兼冲浪者加勒特·莱西是如何专注于当下的。他关注的不是成功驾驭那道浪这一成就。对你来说，专注于过程最简单的方法之一，就是专注于进行一次番茄工作法，即一次二十五分钟的定时工作，而不是专注于完成一项任务。这里的核心思想是，你大脑中那个习惯性的“僵尸”部分喜欢过程，因为它可以无意识地机械前行。让友好的习惯僵尸协助完成一个过程，远比协助达成一个结果要容易得多。通过专注于过程而非结果，你允许自己远离自我评判，比如“我离完成更近了吗？”相反，你允许自己放松地融入工作的流动中。关键在于，当分心出现时，这是不可避免的，你要训练自己只是让它流过去。当然，让自己处于分心最少的环境中也是一个非常好的主意。许多学生发现，一个安静的空间，或者如果你买得起的话，降噪耳机，在他们真正试图集中注意力时会有所帮助。"},{"text":"我是芭芭拉·奥克利。感谢大家学习如何学习。"}]},{"key":"ch-24","title":"利用你的僵尸力量来帮助你","file":"chapter-024.mp3","sha256":"35b411ad0fa44f17e67dd748ae5c4caa24eb5a54c9f5b0f88ba014b4902f945a","paragraphs":[{"text":"在这个视频中，我们将深入探讨如何利用你习惯的“僵尸力量”来帮助你避免拖延，同时尽量减少对意志力的使用。你不需要对旧习惯进行彻底的大规模改变。你只需要覆盖其中的一部分，并养成几个新习惯。覆盖旧习惯的技巧在于改变你对线索的反应。你唯一需要运用意志力的地方，就是改变你对线索的反应。为了理解这一点，有助于我们回顾习惯的四个组成部分，并从拖延的角度重新分析它们。"},{"text":"第一个是线索。识别是什么让你进入了“僵尸拖延模式”。线索通常属于以下四个类别之一：1. 地点；2. 时间；3. 你的感受；以及 4. 对他人或对刚刚发生之事的反应。"},{"text":"你是否在网上查找某些信息，然后发现自己开始漫无目的地浏览网页？一条短信是否会打扰你的学习，即使你试图让自己保持专注，也要花上10分钟才能重新进入状态？拖延的问题在于，因为它是一种自动化的习惯，你往往没有意识到自己已经开始拖延了。你可以通过在短暂的时间内关闭手机，或者让自己远离互联网和其他干扰源来预防最具破坏性的线索，例如在进行番茄工作法时。"},{"text":"第二个是常规。假设你没有进行学习，而是经常将注意力转移到不那么痛苦的事情上。当你接收到线索时，你的大脑想要自动进入这种常规。因此，这就是反应线索，你必须在这里主动专注于重新连接你的旧习惯。重塑习惯的关键在于制定计划。养成一个新的仪式可能会有帮助。一些学生养成了习惯，在去上课前把手机留在车里，从而消除了一种强烈的干扰。许多学生发现，在图书馆的安静角落安顿下来很有帮助；在家里，也可以在合适的时间坐到自己喜欢的椅子上，断开所有网络连接，从而提高学习效率。你的计划一开始可能不会完美运作，但请坚持下去。如有必要，调整计划，并享受当你的计划奏效时的那些胜利。不要试图一次性改变所有事情。番茄工作法在转变你对线索的反应方面特别有帮助。"},{"text":"第三个是奖赏。这有时需要一点调查。你为什么在拖延？你能用一种情感回报来替代吗，比如完成某事后的自豪感，即使它很小，一种满足感？你能赢得一场关于你将其变成个人游戏之事的内部小赌注或比赛吗？或者允许自己享受一杯拿铁咖啡，阅读一个喜欢的网站，或者给自己一个毫无愧疚感的晚上，用来观看无脑的电视或浏览网页？你会为更大的成就给自己更大的奖赏吗？也许是电影票，或者一件毛衣，或者一个完全无用的购买。请记住，习惯之所以强大，是因为它们会产生神经学上的渴望。如果你想克服之前的渴望，增加一个新的奖赏会有帮助。只有当你的大脑开始期待那个奖赏时，重要的重新连接才会发生，从而允许你创造新的习惯。许多人发现，在特定时间设定奖赏，例如在中午与朋友在熟食店共进午餐，或在下午5点停止主要任务，可以提供一个坚实的、小型的截止日期，这有助于推动工作。如果你一开始发现难以进入心流状态，不要感到难过。我有时发现，需要通过几个番茄工作法的周期，经历几天的枯燥工作，心流才会开始展开。然后我发现自己开始享受在一个新主题上的工作。也要记住，你越擅长某事，它就越可能变得令人愉快。"},{"text":"第四个是信念。改变拖延习惯最重要的部分是你相信自己能做到的信念。你可能会发现，当事情变得有压力时，你渴望回到旧的、更舒适的习惯中。相信你的新系统有效，这是能让你坚持下去的东西。支撑这一点的部分在于发展一个新的社群。与同学们在一起，或者在虚拟世界中与慕课伙伴在一起，他们可能拥有你也想要发展的那种“我能行”的哲学。与志同道合的朋友一起发展和鼓励这种文化，可以帮助我们记住那些在软弱时刻我们往往忘记的价值观。"},{"text":"我是芭芭拉·奥克利，感谢你们学习如何学习。"}]},{"key":"ch-25","title":"在生活和学习的平衡中","file":"chapter-025.mp3","sha256":"391ebbef65fb767b62dc2b2650857921d3775461baa7179e383dd57a9249a35d","paragraphs":[{"text":"对大多数人来说，学习涉及对许多不同任务进行复杂的平衡。为了让你对自己试图学习和完成的事情保持正确的视角，一个好办法是每周在你的计划本上写一份简短的关键任务周清单。然后，每天在计划本的另一个页面上，写下你可以合理地着手处理或完成的任务列表。试着在前一天晚上写下这份每日任务清单。为什么要前一天晚上呢？研究表明，这有助于你的潜意识去处理清单上的任务，从而让你弄清楚如何完成它们。在睡觉前写下清单，相当于征召你的“僵尸”来帮助你完成第二天清单上的事项。如果你不把任务写在清单上，它们就会潜伏在你工作记忆那大约四个槽位的边缘，占据宝贵的心理空间。但一旦你制定了任务清单，工作记忆就被释放出来用于解决问题。所以，让我们看看我的一份每日任务清单。"},{"text":"正如你在这里看到的，只有六项内容。有些是过程导向的。例如，我有一篇论文要在几个月后提交给期刊。因此，我在大多数日子里都会花一点专注时间致力于完成它。有几项是结果导向的。但这仅仅是因为它们可以在有限的时间内完成。注意我的提醒事项。我希望在处理每一项时都能保持专注。而且我想享受乐趣。我确实发现自己被带偏了，因为我忘了关闭电子邮件。为了让自己重新进入状态，我设定了一个22分钟的番茄工作法挑战，使用电脑桌面上的计时器。为什么是22分钟？嗯，为什么不呢？我不必每次都做同样的事情。还要注意，通过切换到番茄工作法模式，我已经转向了过程导向。我清单上的任何一项都不算太大，因为我一天中还有其他事情要做。有会议要参加，有讲座要讲。有时我会在清单中穿插一些涉及身体动作的任务，哪怕只是打扫一下卫生。我承认，这通常不是我最喜欢做的事情。不知何故，因为我把它们当作发散模式的休息，我往往很期待这些时刻。"},{"text":"将其他任务与学习混合在一起，似乎能让一切变得更愉快，并防止你长时间不健康地坐着。随着时间的推移，随着我积累了更多经验，我在估算完成任何特定任务所需时间方面变得熟练得多。当你对自己在特定时间内能合理完成的事情变得更加现实时，你会发现自己进步很快。在你的计划本中记下什么有效，什么无效。注意我设定的当天目标结束时间，下午5点，看起来似乎不太对劲，不是吗？但它是对的，而且它是你每日计划本中最重要的组成部分之一。规划你的下班时间就像规划你的工作时间一样重要。通常，我打算在下午5点下班，虽然当我学习新东西时，有时在晚上休息后、就在睡觉前再看一下会是一种乐趣；偶尔，还有一个我正在收尾的重大项目，比如这个让我不得不稍微加班的在线课程。你可能会想，嗯，是的，你知道，但你是一位教授，我们姑且说，你已经过了年轻时的学习阶段。当然，早点下班对你来说没问题。然而，我最敬佩的学习专家之一卡尔·纽波特，在他学生生涯的大部分时间里都采用下午5点下班的时间。他最终从麻省理工学院获得了博士学位。换句话说，尽管这种方法对某些人来说可能看似不可思议，但它对于严格学术项目中的本科生和研究生是可行的。"},{"text":"一次又一次，那些致力于在努力工作之余保持健康休闲时间的人，表现优于那些顽固地追求无尽跑步机式生活的人。当然，你的生活可能不适合这种带有休息和休闲时间的日程安排。你可能身兼两职，课程太多，已经精疲力竭。但无论你的生活如何，试着挤一点休息时间出来。还有一件事——正如写作教练达芙妮·格雷格兰特建议她的写作客户那样，早上先吃掉你的青蛙。试着先处理最重要且最讨厌的任务。至少在你醒来后，先做一个番茄工作法周期。这非常有效。你是否有时需要因为意外事件而改变计划？当然需要，但请记住意外发现定律；幸运女神眷顾尝试者。良好的计划是尝试的一部分。紧盯你的学习目标，尽量不要因偶尔的阻碍而过于不安。"},{"text":"我是芭芭拉·奥克利。感谢你们学习如何学习。"}]},{"key":"ch-26","title":"总结拖延症","file":"chapter-026.mp3","sha256":"ef52464a958da412216173881ebd2aba82ef53bb38f13f6f9816c1606e453757","paragraphs":[{"text":"良好的学习往往涉及一点一点、一天一天地构建稳固的神经支架。这很像举重运动员通过日复一日的锻炼来建立肌肉。这就是为什么克服拖延症如此重要。你希望跟上学习的进度，避免最后一刻的临时抱佛脚。因此，接下来是关于克服拖延症关键方面的概述。"},{"text":"坚持使用计划日志，以便你可以轻松追踪何时达成目标，并观察哪些方法有效，哪些无效。"},{"text":"每天致力于某些例行事务和任务。"},{"text":"在前一天晚上写下你计划的任务，这样你的大脑就有时间沉浸在你的目标中，并有助于确保成功。"},{"text":"将你的工作安排成一系列的小挑战。"},{"text":"始终确保你，以及你的僵尸，获得大量的奖励。"},{"text":"花几分钟时间品味幸福和胜利的感觉，这也给你的大脑一个机会暂时切换模式。"},{"text":"故意延迟奖励，直到你完成一项任务。"},{"text":"留意拖延症的线索。尝试把自己放在新的环境中，那里很少有拖延症的线索，例如图书馆的安静区域。"},{"text":"对你的新系统建立信任。你希望在专注集中的时候努力工作，同时也足够信任你的系统，这样当到了放松的时候，你能够真正放松，而没有内疚或担忧的感觉。"},{"text":"为仍然拖延的时候准备备用计划。毕竟没有人是完美的。"},{"text":"每天先“吃青蛙”，也就是先处理最难的任务。祝实验愉快。"},{"text":"我是芭芭拉·奥克利。感谢大家学习如何学习。"}]},{"key":"ch-27","title":"深入探索记忆","file":"chapter-027.mp3","sha256":"eadd9fc4f401062b0e4914097d910e53eb7e8c95b45e00932891cb104c53bc37","paragraphs":[{"text":"在这段视频和下一段视频中，我们将深化对记忆的理解。正如你可能开始意识到的那样，记忆只是学习和培养专长的一部分，但它往往是一个重要的部分。你可能会惊讶地发现，我们拥有出色的视觉和空间记忆系统，它们可以帮助构成我们长期记忆的一部分。这就是我的意思。"},{"text":"如果你被要求环顾一个你从未去过的房子，你很快就会对家具的大致布局、房间的位置、配色方案以及浴室柜子里的药品有一个概念。在短短几分钟内，你的大脑就会获取并保留数千条新信息。即使几周后，你脑海中保留的信息仍然会比你花同样时间盯着空白墙壁所记住的多得多。你的大脑天生就是为了保留关于某个地方的这种一般性信息而构建的。如果你能利用这些天生超大的、视觉化的、空间化的记忆能力，你可以极大地增强你的记忆力。我们的祖先不需要对名字或数字有巨大的记忆力，但他们确实需要记住如何从为期三天的鹿猎中回家，或者记住那些位于营地南侧岩石斜坡上的饱满蓝莓的位置。这些进化需求帮助锁定了一套优越的“东西在哪里”和“它们看起来什么样”的记忆系统。"},{"text":"为了开始利用你的视觉记忆系统，试着制作一个非常令人难忘的视觉图像，代表一个你想要记住的关键项目。例如，这里有一个你可以用来记住牛顿第二定律的图像，f = ma。这是一个将力与质量和加速度联系起来的基本关系（力 = 质量 x 加速度）。人类花了，哦，大约二十万年才弄清楚这一点。公式中的字母 f 可以代表飞行，m 可以代表骡子，而 a，嗯，那就由你自己决定了。"},{"text":"图像对记忆如此重要的部分原因在于，图像直接连接到你右脑的视觉空间中心。图像通过利用具有增强记忆能力的视觉区域，帮助你封装一个看似平淡且难以记住的概念。你通过唤起感官所建立的神经挂钩越多，你就越容易回忆起这个概念及其含义。除了仅仅看到那匹骡子，你还可以闻到骡子的气味，你可以感受到那匹骡子所感受到的同样的风压……你甚至可以听到风呼啸而过的声音。图像越有趣、越能唤起感官，效果就越好。集中注意力会将某事物带入你的临时工作记忆，但为了让某事物从工作记忆转移到长期记忆，应该发生两件事：这个想法应该是令人难忘的；比如，我的沙发上有一只巨大的飞行骡子在嘶鸣，喊着 f = ma，并且它必须被重复。否则，记住你那些微小的代谢吸血鬼，它们可以在与那个记忆相关的神经模式加强和固化之前，将其吸走。"},{"text":"重复很重要。即使你使某事物变得令人难忘，重复也有助于将那个令人难忘的项目牢固地嵌入长期记忆中。记住，不要一天内重复很多次，而是要在几天内零星地重复。索引卡通常会有帮助。写下并说出你试图学习的内容似乎能增强保留率。例如，如果你试图学习物理学中的概念，你可以拿一张索引卡，写下希腊字母 rho (ρ)。这是密度的常见缩写。你在卡片的一面写下它，在另一面写下其余的信息。手写有助于你更深入地编码，即将你试图学习的内容转化为神经记忆结构。当你在写下每立方米千克数（千克/立方米）时，你可以想象一个模糊的千克质量，感觉那团质量潜伏在一个恰好每边一米大的超大行李中。你越能将试图记住的东西转化为令人难忘的东西，回忆起来就越容易。"},{"text":"你会想要大声说出这个词及其含义，开始为材料设置听觉挂钩。接下来，只需看着写有希腊字母 rho (ρ) 的那一面卡片，看看你是否能记住卡片另一面写的是什么。如果你不能，就翻过来，提醒自己应该知道什么。如果你能记住，就把卡片收起来。现在，做点别的事。也许再准备一张卡片，并测试自己。一旦你有了几张卡片，试着把它们全部过一遍，甚至打乱顺序，看看你是否能记住它们。这有助于交错你的学习。如果你稍微有点吃力，不要感到惊讶。一旦你认真尝试了你的卡片，就把它们收起来。等待，然后再把它们拿出来，也许在你睡觉之前。记住，睡眠是你的大脑重复模式并拼凑出解决方案的时候。在几天内简要重复你想要记住的内容。也许每天早晨或每天傍晚几分钟。随着材料在你脑海中变得牢固，逐渐延长重复之间的时间间隔。"},{"text":"通过随着你对掌握程度的确信度增加而增加间隔，你会将材料更牢固地锁定在位置上。像 Anki 这样优秀的闪卡系统内置了算法，以从几天到几个月的规模进行重复。有趣的是，记住人们名字的最好方法之一，就是在最初学习名字后，简单地尝试在逐渐增加的时间间隔内从记忆中检索出这些人的名字。"},{"text":"我是芭芭拉·奥克利。感谢你们学习关于学习的内容。"}]},{"key":"ch-28","title":"什么是长期记忆？","file":"chapter-028.mp3","sha256":"8d78e83bdce66dc4fd4cab15afb1e2bc339f0c958b41839cdcee39030422a0ad","paragraphs":[{"text":"欢迎回到《学会学习》课程。如果你无法学习新事物，无法记住你遇到的新面孔，或者无法记住别人告诉你的事情，那会是什么样子？在记忆研究的史册中，确实发生过这样的事，涉及一位著名的患者，他的姓名首字母缩写为HM。"},{"text":"在27岁时，HM接受了治疗癫痫的手术，手术切除了他大脑两侧的海马体。海马体形状像海马，其名称源自希腊语中的希波斯，意为马，以及坎波斯，意为海怪。手术很成功，癫痫被治愈了，但代价是惨重的。HM再也无法记住新事物，他变得严重失忆。奇怪的是，你可以和HM进行正常的对话，但如果你离开房间几分钟，他就记不起你，也记不起你们讨论过什么。"},{"text":"在电影《记忆碎片》中，由盖·皮尔斯饰演的角色因脑震荡而患有这种类型的失忆。请注意，他在身上纹上了信息，以免忘记自己必须做的事。HM可以学习其他东西，比如新的运动技能，但他记不起自己学过它。存在多个记忆系统，用于不同类型的学习。通过研究HM以及接受过类似手术的动物，我们了解到海马体是大脑中负责学习和记忆事实与事件系统的重要组成部分。没有海马体及其输入，就不可能将新记忆存储在大脑皮层中，这个过程被称为记忆巩固，可能需要很多年。HM能记住他童年时期的事情，但他很难记住手术前几年发生的事，那些事情尚未完全巩固。当你遭受严重脑震荡时，也会发生类似的情况，但这通常会恢复，不像HM那样从未好转。"},{"text":"记忆不是固定的，而是你大脑中活生生的、不断变化的部分。每当你回忆一段记忆时，它就会发生变化，这个过程被称为再巩固。甚至可以通过暗示和想象来植入虚假记忆，尤其是对于想象力丰富的儿童，这些虚假记忆与真实记忆是无法区分的。"},{"text":"这里是一个总结："},{"text":"绿色的巩固过程将活动记忆中的大脑状态存储到长期记忆中，通过改变神经元树突上的突触来实现。这些长期记忆可以长期处于休眠状态，直到记忆被提取并通过红色的过程重新激活到短期工作记忆中。被重新激活的记忆处于新的背景中，这本身也可以转移到长期记忆中，从而通过再巩固改变旧记忆。"},{"text":"我们的记忆彼此交织。当我们学习新事物时，我们的旧记忆也会改变。与巩固一样，再巩固也发生在睡眠期间。这就是为什么将学习分散在一段时间内比一次性集中学习更有效。如果你想花一个小时学习某样东西，如果你在一个学期里每个月花10分钟，比在一天内花一个小时，你会记得更久。相反，如果你等到考试前一天才突击复习材料，你可能能在第二天考试中回忆起来，但它会很快从记忆中消退。"},{"text":"除了神经元，大脑还有几种支持细胞，称为胶质细胞。星形胶质细胞是人脑中数量最多的胶质细胞。星形胶质细胞为神经元提供营养，维持细胞外离子平衡，并参与损伤后的修复。在这张大脑皮层的照片中，星形胶质细胞呈绿色，神经元呈蓝色。星形胶质细胞复杂的分支包裹着神经元，每个分支拥抱数千个突触。最近的一项实验表明，这些星形胶质细胞可能在学习中也起着重要作用。当人类星形胶质细胞被植入小鼠大脑时，这些“人化”的小鼠学习速度更快。有趣的是，当人们检查爱因斯坦的大脑以找出是什么让他如此极具创造力时，唯一能发现的差异是他比普通人拥有更多的星形胶质细胞。星形胶质细胞可能是理解人类智力的关键吗？嗯，我们对大脑了解得越多，我们就越需要重新思考学习。"},{"text":"我是特里·塞诺夫斯基。祝学习愉快，我们下次再见。"}]},{"key":"ch-29","title":"创建有意义的组块与记忆宫殿技术","file":"chapter-029.mp3","sha256":"0a55f2f02b8b2c0f28746fd0cb869588e4e30efbf7d0980be6d0cfbc16544087","paragraphs":[{"text":"在这个视频中，我们将更深入地探讨记忆。记忆的一个关键技巧是创建有意义的组块，以简化材料。假设你想记住四种植物，它们有助于抵御吸血鬼。大蒜、玫瑰、山楂和芥末。这些单词的首字母缩写为 GRHM，因此你只需要记住格雷厄姆饼干（graham cracker）的图像即可。"},{"text":"通过将数字与令人难忘的事件联系起来，记忆数字会容易得多。例如，1965 年可能是你的一位亲戚出生的年份。或者，你可以将数字与你熟悉的数字系统联系起来。例如，11.0 秒是 100 米短跑的一个良好成绩。或者 75 可能是你喜欢的滑雪帽编织针上的针数。就我个人而言，我喜欢将数字与我在某个年龄时或将来某个年龄时的感受联系起来。数字 18 很容易记住。那是我踏入社会的年龄。到 104 岁时，我希望自己成为一位年迈但快乐的曾祖母。"},{"text":"许多学科使用令人难忘的句子来帮助学生记忆概念。句子中每个单词的首字母也是需要记忆的列表中每个单词的首字母。例如，医学领域充满了令人难忘的助记符。其中比较文雅的包括：“Some Lovers Try Positions That They Can't Handle”（一些恋人尝试他们无法承受的姿势），用来记忆手部的腕骨名称。以及“Old People from Texas Eat Spiders”（来自德克萨斯州的老人吃蜘蛛），用来记忆颅骨。一次又一次，这些类型的记忆技巧被证明是有帮助的。如果你正在记忆一些常用的内容，请通过在线搜索查看是否有人想出了特别令人难忘的记忆技巧。如果没有，试着想出你自己的。"},{"text":"记忆宫殿技术是一种特别强大的方法，用于对你想要记住的事物进行分组。它涉及在脑海中唤起一个熟悉的地方。比如你家的布局，并把它当作一种视觉便签本，你可以在其中存放你想要记住的概念图像。你所要做的只是在脑海中唤起你熟悉的地方。你的家、你上学的路线，或者你最喜欢的餐厅，然后，在富有想象力的眼睛眨眼的瞬间，这就变成了你将用作便签本的记忆宫殿。"},{"text":"记忆宫殿技术对于记忆不相关的项目很有用，例如购物清单。牛奶、面包、鸡蛋。要使用这项技术，你可能会想象一个巨大的牛奶瓶就在你的前门里面。面包被扔在沙发上，一个破裂的鸡蛋从咖啡桌的边缘滴落。换句话说，你会想象自己走过一个你非常熟悉的地方，同时伴随着你想要记住的事物的惊人且令人难忘的图像。如果你正在学习金融、社会学、化学或类似科目，并且有列表需要记忆，你可以使用同样的方法。第一次这样做时，速度会很慢。构建一个坚实的心理图像需要一点时间。但你做得越多，速度就越快。"},{"text":"一项研究表明，使用记忆宫殿技术的人，在仅进行一两次心理行走练习后，就能记住 40 到 50 个项目列表中超过 95% 的内容，其中项目被放置在当地大学的场地上。以这种方式使用大脑，记忆可以成为一种杰出的创造性练习，同时为更多的创造力建立神经挂钩。纯粹主义者可能会嗤之以鼻，认为使用怪异的记忆噱头并不是真正的学习。但研究人员表明，使用这种技巧的学生表现优于不使用这些技巧的学生。此外，关于人们如何成为专家的影像学研究表明，这些记忆工具加速了组块和整体模板的获取。帮助新手更快地转变为半专家，甚至只需几周时间。"},{"text":"记忆技巧允许人们通过轻松访问长期记忆来扩展他们的工作记忆。更重要的是，记忆过程本身成为一种创造性的练习。你使用这些创新技术记忆得越多，你就变得越有创造力。这是因为你在早期就为未来的联系构建了这些狂野、意想不到的可能性。即使在你最初内化这些想法的时候，你越是练习这种所谓的记忆肌肉，你就越容易记住。起初，为一个方程构建一个生动的图像并将其嵌入，比如说，你记忆宫殿的水槽中，可能需要 15 分钟，但后来执行类似的任务可能只需要几分钟或几秒钟。你还会意识到，当你开始内化材料的关键方面，花一点时间将最重要的要点记在脑海中时，你会对它理解得更加深入。这些公式对你的意义将远大于你仅仅在书中查阅它们时的意义。你将能够在测试和现实世界的应用中更熟练地运用这些公式。你可能会说，好吧，你只是没有那种创造力，一个方程或理论很难拥有自己的宏大动机或挑剔的情感需求来帮助你理解和记住它。但请记住，你孩童般的创造力仍然在你内心。你只需要去触及它。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-30","title":"总结记忆","file":"chapter-030.mp3","sha256":"5c3bc31943269b790366d54a5a22695baa4b57665f37a077cb23edc0ba91e80d","paragraphs":[{"text":"学会以更有条理却又富有创造性的方式使用你的记忆力，有助于你学会集中注意力，同时建立那些狂野的发散性联系，从而构建更牢固的记忆。以下是我们讨论过的关于记忆力的核心观点："},{"text":"在这门课程中，我们讨论了参与你组块概念能力的两个主要记忆系统。第一个是长期记忆，它就像一个存储仓库。你需要通过练习和重复来帮助将信息存入长期记忆，以便更容易地提取它们。在同一天内集中进行练习和重复是个坏主意。你希望将练习延伸到好几天。这就是为什么克服拖延症很重要。它有助于你建立更好的记忆，因为你开始得更早。"},{"text":"第二个是工作记忆，它就像一块容易快速褪色的劣质黑板。你的工作记忆只能容纳大约四个项目。从某种意义上说，当你掌握了一项技术或概念时，它会压缩这些想法，使它们在你想起它们时占用工作记忆中的空间更少。这释放了你的思维空间，使其能够更轻松地处理其他想法。"},{"text":"我们拥有出色的视觉和空间记忆系统。如果你能利用这些系统，它将有助于提高你的记忆力。为了开始利用你的视觉记忆系统，试着制作一个非常令人难忘的视觉图像，代表你想要记住的一个关键项目。除了仅仅“看”之外，试着去“感受”、“听”甚至“闻”到你试图记住的东西。图像越有趣、越能引起共鸣，效果就越好。一如既往，在几天内重复练习真的很有帮助。"},{"text":"记忆力的另一个关键是要创建有意义的组块来简化材料。试着将数字与年份或你熟悉的系统（如跑步时间）联系起来。许多学科使用令人难忘的句子。记忆宫殿技术，即将令人难忘的图像放置在一个你熟悉的场景中，允许你利用视觉记忆系统的强大力量，提供了一种特别强大的方式来对你想要记住的事物进行分组。通过创建有意义的组块和缩写，你可以简化并组块你试图学习的内容，以便更容易地将其存储在记忆中。并且，通过记忆你理解的材料，你可以以深刻的方式内化这些材料。你正在强化你成为该材料真正大师所需的精神图书馆。祝你记忆愉快！"},{"text":"我是芭芭拉·奥克利。感谢大家学习如何学习。"}]},{"key":"ch-31","title":"如何成为更好的学习者","file":"chapter-031.mp3","sha256":"350df1f005e6ca187c34b7d921ae1663b6b602d1dc8779ce73a0c2efb7387037","paragraphs":[{"text":"欢迎回到《学会学习》课程。今天我们要谈谈如何成为一名更好的学习者。随着我们对大脑了解得越多，我们就能成为更好的学习者，这里有两个关于如何更好地学习的建议。"},{"text":"建议一——你能给大脑最好的礼物就是体育锻炼。我们曾经认为你大脑中的所有神经元在出生时就已经全部存在，但我们现在知道，在少数几个地方，每天都有新的神经元诞生。其中一个地方就是你的海马体，这是一个对学习新事物非常重要的脑区，我们在课程早些时候已经讨论过。在这个实验中，展示了一只老鼠，它正在学习如何区分一张花朵的图片和一张飞机的图片。背景是海马体中神经元的照片，旧神经元显示为蓝色，新产生的神经元显示为红色。随着老鼠学习这项任务，这些新神经元被招募来帮助在两张图片之间执行更好的模式分离。这些新神经元帮助你学习新事物，但如果你不使用它们，它们就会死亡。新的体验会拯救它们。"},{"text":"有趣的是，锻炼也有助于新神经元的存活。就帮助你更好地学习而言，锻炼比目前市场上任何药物都有效得多。它有益于你所有的重要器官，而不仅仅是大脑。不幸的是，学校正在取消体育课和课间休息，以便为更多的教学腾出空间。体育课和课间休息是课程中最重要的部分，这一点毋庸置疑。"},{"text":"这里还有另一个建议——这与熟能生巧有关，但只有当你的大脑做好准备时才行。在你大脑的发展过程中，有一些关键的时期。当特定能力出现突然的进步时，要预期它们会发生，并为它们做好准备。第一语言习得的关键期一直延伸到青春期。大脑中研究最充分的关键期之一，是双眼深度感知或立体视觉在生命最初两年成熟的时期。"},{"text":"立体视觉是像这里展示的《神奇眼》图片背后的魔法。如果你盯着这张图片并稍微交叉你的眼睛，你会看到楼梯从纸面上凸出来。两只眼睛中的图像之间存在轻微的位移，你的大脑将这种轻微的位移解释为深度的差异。然而，并非每个人都能看到这一点。超过5%的人口是立体盲。如果在发育的前两年，两只眼睛没有正确对齐，你视觉皮层中的神经元将无法适当增强来自两只眼睛的输入，深度感知就会永久受损。好吧，那是教条。苏·巴里，我在普林斯顿大学读研究生时的朋友，能够通过眼部练习恢复立体视觉，并为此写了一本书，题为《修正我的凝视：一位科学家进入三维视觉的旅程》。"},{"text":"练习既可以修复，也可以训练大脑。但这需要更长的时间，超过了关键期。这就引出了僵尸。僵尸无法学习。从它们的行为也可以清楚地看出，它们有脑损伤。特别是在它们皮层的前部，也就是负责制定计划的部分，以及它们的语言区域。学习、计划、语言，这些是使我们成为人类的技能。前额叶皮层也参与社会行为中的复杂分析，以及决策和计划。它是皮层中最后成熟的部分，所以直到它成熟之前，你身上可能还带有一点僵尸的特质。"},{"text":"另一位患者，EVR，在他前额叶皮层的社会部分遭受了中风。EVR智商很高，看起来正常，但他因为做出糟糕的财务决策和糟糕的社会互动而毁了自己。他失去了他的家和家庭。良好的判断力需要很长时间和大量经验才能获得。学习太重要了，不能只留在教室里。学会学习是一项你可以掌握的技能，你可以用它来改善你生活的方方面面。本周你将学到更多的学习技巧，并可以在 http://www.brainfacts.org/ 上跟进这些内容。"},{"text":"我是特里·塞诺夫斯基，祝你学习愉快，我们下次再见。"}]},{"key":"ch-32","title":"文艺复兴式学习与释放你的潜能简介","file":"chapter-032.mp3","sha256":"ef34cbb79da1bb0dddd8045197123c36667fb9647648ee3c85db60efa26e0d3f","paragraphs":[{"text":"本周，我们将总结一系列重要的想法和技巧，这些内容将帮助你完善并提升你的学习能力。我们将运用隐喻和类比，学习如何与队友进行富有成效的合作，如何不削弱自身的优势，以及最终如何在考试中取得好成绩。"},{"text":"不过，在我们开始本周的视频之前，有一个重要的观点需要提及：学习并不是按逻辑线性推进的，并不是每天都能往你的知识书架上整齐地增加一个新包裹。有时，在构建你的理解过程中，你会遇到瓶颈。以前看起来合理的事情，突然之间可能会变得令人困惑。这种类型的知识崩塌似乎发生在你大脑重构其理解、建立更坚实基础的时候。对于语言学习者来说，他们偶尔会经历一段时期，在此期间，外语突然变得完全无法理解。请记住，消化新知识需要时间。你不可避免地会经历一些看似在理解上令人沮丧地倒退的阶段。这是一种自然现象，意味着你的大脑正在与材料进行深度的搏斗。你会发现，当你从这些暂时的挫折期中走出来时，你的知识库将会取得惊人的飞跃。"},{"text":"我是芭芭拉·奥克利，感谢大家学习如何学习。"}]},{"key":"ch-33","title":"创造一个生动的视觉隐喻类比","file":"chapter-033.mp3","sha256":"9c23edb36335c70a116c021b07a3acdd6c51f0a99081a3ab1a3edd8555caeaaa","paragraphs":[{"text":"要想不仅记住，而且理解某个概念，你能做的最好的事情之一，就是为它创造一个隐喻或类比；通常，越具视觉冲击力越好。隐喻只是一种意识到一件事物在某种程度上与另一事物相似的方式。像一位地理老师描述叙利亚的形状像一碗麦片，而约旦像耐克Air Jordan运动鞋这样简单的想法，可以让学生记上几十年。如果你试图理解电流，把它想象成水会有帮助。同样，电压可以感觉像压力。一种推力。随着你对所专注的主题的理解变得更加深入，你可以修改你的隐喻，或者抛弃它们，创造更有意义的隐喻。"},{"text":"隐喻和可视化，即能够在脑海中看到某物，不仅在艺术和文学中特别有帮助，也让科学和工程界得以取得进步。例如，在19世纪，当化学家开始想象和可视化分子的微观世界时，巨大的进步开始显现。这里有一幅有趣的插图，描绘了苯环中的猴子，出自1886年出版的一本内部恶搞德国学术化学生活的刊物。注意单键，也就是猴子的手，以及带有小尾巴的双键。"},{"text":"假装你是你试图理解的那个概念，这通常很有帮助。把自己想象成一个电子，穿着温暖舒适的拖鞋，钻过一块铜板。或者偷偷溜进代数方程中的X，感受从兔子洞里探出头来的感觉。但千万不要不小心除以零，让自己被炸飞。在化学中，把阳离子比作一只猫，因为它有爪子，所以是“爪子”（pawsitive，是爪子和带正电的英文双关语）。把阴离子比作一个洋葱：它带负电，而洋葱会让你哭，给人一种负面的感觉。隐喻从来都不是完美的，但在科学中，所有的模型都只是隐喻，这意味着它们在某个时候会失效。但别管那些。"},{"text":"隐喻和模型在赋予你对你试图理解的过程或概念背后的核心思想的物理理解方面，往往至关重要。有趣的是，隐喻和类比有助于让人们摆脱定势效应，即被以错误的方式思考问题所阻碍。例如，讲述一个简单的故事，士兵从许多不同的方向同时攻击一座堡垒，可以为学生打开创造性的路径，让他们看到许多低强度的射线如何被有效地用来摧毁癌性肿瘤。故事，即使只是作为愚蠢的记忆技巧使用，也可以让你更容易保留你试图学习的内容。隐喻也有助于将想法粘在你的脑海中，因为它们与已经存在的神经结构建立了联系。这就像能够用描图纸追踪图案一样。隐喻至少能帮你获得一种对正在发生的事情的感觉。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-34","title":"无需嫉妒天才","file":"chapter-034.mp3","sha256":"5a76eaadce07c41e595358619adc60e99bfff3e5341fcc8967c1923c7925f535","paragraphs":[{"text":"这是一个很好的时机，让我们退后一步，从另一个视角再次审视组块化。请注意我们在这里正在做的事情。我们通过跳回去重新审视并深化我们之前已经讲过的一个主题，从而在进行交错学习。"},{"text":"学习数学和科学，与学习一项运动之间，存在着一种有趣的联系。以棒球为例，你不可能在一天之内学会如何击球。相反，你的身体通过多年间大量的重复练习来完善你的挥棒动作。流畅的重复创造了肌肉记忆，因此你的身体只需一个念头，也就是一个组块，就知道该怎么做，而不必去回忆击球所涉及的所有复杂步骤。同样地，一旦你理解了在数学和科学中为什么要做某件事，你每次做的时候就不必再向自己反复解释“怎么做”了。你不需要口袋里装着一百颗豆子，一遍又一遍地摆出十行、每行十颗的豆子，来让你明白十乘以十等于一百。在某个时刻，你只是凭记忆就知道了这一点。"},{"text":"例如，你记住了这样一个概念：当你在相乘具有相同底数的数字时，你只需要把指数，也就是那些小小的上标数字，直接相加。十的四次方乘以十的五次方等于十的九次方。如果你经常使用这个程序，通过做许多不同类型的题目，你会发现，你对这个程序背后的“为什么”和“怎么做”的理解，远比从老师或书本上得到常规解释后的理解要深刻得多。这种更深的理解源于这样一个事实：是你的大脑构建了意义的模式，而不是简单地接受别人告诉你的东西。请记住，人们是通过尝试从他们感知到的信息中找出意义来学习的。他们很少仅仅通过别人告诉他们就能学会任何复杂的东西。"},{"text":"国际象棋大师、急诊室医生、战斗机飞行员以及许多其他专家，往往必须迅速做出复杂的决策。他们关闭了有意识系统，转而依赖他们训练有素的直觉，调用他们根深蒂固的组块库。在某个时刻，有意识地理解你为什么做你所做的事，只会让你变慢，并打断心流，从而导致更糟糕的决策。但等等，国际象棋大师和那些能在脑海中相乘六位数的人，是天赋异禀的吗？不一定。我要直截了当地告诉你。当然，智力很重要。更聪明通常意味着拥有更大的工作记忆。你那辆高性能跑车般的记忆，可能能够同时保持九件事，而不是四件，并且你能像斗牛犬一样牢牢抓住这些事物，这使得学习变得更容易。但猜猜怎么着，这也使得你更难具有创造力。怎么会这样呢？这就是我们的老朋友兼老敌人——定势效应。"},{"text":"你脑海中已经持有的想法，可能会阻碍你产生新的想法。卓越的工作记忆可能会把想法抓得太紧，以至于新想法很难轻易渗透进来。这种高度控制的注意力，偶尔需要一点类似注意力缺陷多动障碍的新鲜空气，换句话说，就是即使你不想让注意力转移，也能让注意力转移的能力。如果你是那种一次无法在脑海中保持太多事物的人，你在讲座中会失去焦点并开始走神，必须找一个安静的地方才能集中注意力，以便最大限度地利用你的工作记忆，那么，欢迎加入创意人士的行列。拥有相对较小的工作记忆，意味着你更容易将你的学习泛化到新的、更具创造性的组合中。因为你的工作记忆，它源自前额叶皮层的聚焦能力，不会把所有东西都锁得太紧。你可以更容易地从大脑的其他部分获取输入。这些其他区域，包括感觉皮层，不仅与你周围环境中发生的事情更加协调，而且是梦的来源，更不用说创造性的想法了。有时，甚至很多时候，你可能需要付出更多努力才能理解正在发生的事情。但一旦你把某件事组块化，你就可以拿起那个组块，把它翻来覆去地看，把它进行创造性的演练，即使你之前认为自己没有这种能力。"},{"text":"这里还有另一个要点，要放进你的心理组块器中：是练习，特别是对材料中最难部分进行的刻意练习，能够帮助普通大脑进入那些拥有更多天赋之人的领域。就像你可以练习举重，随着时间推移获得更大的肌肉一样，你也可以练习某些心理模式，这些模式在你的脑海中会加深并扩大。无论你是天生有天赋，还是必须努力才能牢固掌握基础知识，你都应该意识到，如果你觉得自己是个冒牌货，你并不孤单。那种感觉是，当你碰巧在一次考试中表现良好，然后觉得下一次考试时，他们以及你的家人和朋友肯定会发现，你实际上是多么无能。这种感觉极其普遍，甚至有一个名字——冒牌货综合征。如果你遭受着这类无能感，只要意识到许多其他人也在私下里分享着这种感觉。俗话说，每个人都有不同的天赋，当一扇门关上时，另一扇门就会打开。抬起头，把目光投向那扇打开的门。"},{"text":"我是芭芭拉·奥克利。感谢你学习如何学习。"}]},{"key":"ch-35","title":"改变你的思维，改变你的人生","file":"chapter-035.mp3","sha256":"c3777c732e68e2954698558cbd54d4de4089ae7bb48105f7dc456ebb35418e7a","paragraphs":[{"text":"我热爱阅读历史，并深受非凡人物传记的启发。我读过的最与众不同的人物之一，之所以令人鼓舞，不仅因为他极其非凡，还因为他极其平凡。"},{"text":"圣地亚哥·拉蒙-卡哈尔是个天生的捣蛋鬼。在十九世纪六十年代的西班牙乡村，对于古怪的青少年罪犯来说，选择并不多。因此，卡哈尔在十一岁时就进了监狱。卡哈尔固执且叛逆。谁能想到，圣地亚哥·拉蒙-卡哈尔有一天不仅会获得诺贝尔奖，最终还会被誉为现代神经科学之父？"},{"text":"卡哈尔在二十出头时，才开始从不良少年的行为转向传统的医学研究。有证据表明，髓鞘——那种帮助信号沿神经元更快移动的脂肪绝缘层——在有些人身上直到二十多岁才发育完全。这可能解释了为什么青少年常常难以控制他们的冲动行为。大脑中意图区域与控制区域之间的神经连接尚未完全形成。然而，当你使用神经回路时，似乎有助于在这些回路上构建髓鞘；更不用说还会产生许多其他微观变化。"},{"text":"练习似乎能加强并巩固不同脑区之间的连接，在大脑的控制中枢与存储知识的中枢之间建立高速公路。就卡哈尔的情况而言，似乎他自然的成熟过程与他自身发展思维的努力相结合，帮助他掌控了自己的整体行为。似乎人们可以通过练习使用那些神经元的思维来增强其神经回路的发展。我们对神经发育的理解仍处于起步阶段。有一点正在变得清晰：通过改变我们的思维方式，我们可以对大脑做出重大改变。"},{"text":"卡哈尔一生中结识并合作了许多杰出的科学家。这些人通常比他聪明得多。然而，在卡哈尔的自传中，他指出，虽然杰出的人可以做出非凡的工作，但就像其他人一样，他们也可能粗心大意并带有偏见。卡哈尔认为，他成功的关键在于他的毅力。他称之为“不那么聪明的人的美德”，结合了他灵活改变主意和承认错误的能力。卡哈尔指出，任何人，甚至是智力平平的人，都可以改变自己的大脑，使得即使天赋最低的人也能获得丰硕的成果。"},{"text":"像查尔斯·达尔文这样的人，他的进化论使他成为人类历史上最具影响力的人物之一，通常被视为那种天生的天才。你可能会惊讶地得知，与卡哈尔类似，达尔文在学校时是个差生。他从医学院退学，最终令他的父亲惊恐万分，作为船上的博物学家开始了环球航行。独立在外，达尔文能够用全新的眼光审视他收集的数据。带着独自学习材料的目标去接近它，可以为你提供一条通往精通的独特路径。通常，无论你的老师和教科书多么优秀，只有当你偷偷去看其他书籍或视频时，你才开始看到通过单一老师或书籍所学到的内容，只是该主题完整三维现实的一个部分版本，而这个主题还联系着其他由你选择的迷人话题。为自己的学习承担责任是你所能做的最重要的事情之一。"},{"text":"圣地亚哥·拉蒙-卡哈尔不仅深刻理解如何开展科学研究，还深刻理解人们如何相互交往。他警告其他学习者，总会有人批评或试图破坏你所做的任何努力或成就。这对每个人都会发生；不仅仅是诺贝尔奖得主。如果你在学业上表现良好，你周围的人可能会感到受到威胁。你的成就越大，其他人有时就越会攻击和贬低你的努力。另一方面，如果你考试不及格，你也可能会遇到批评者，他们投来更多的尖刻言语，说你缺乏必要的素质。"},{"text":"我们常被告知，共情普遍有益。但事实并非如此。重要的是学会偶尔开启一种冷静的超然态度，这不仅能帮助你专注于你试图学习的内容，还能在你发现某些人的利益在于打压你时，让你忽略这些人。这种打压现象太常见了，因为人们往往既具有竞争性，也具有合作性。当你年轻的时候，掌握这种超然态度可能很困难。我们对自己正在从事的工作自然感到兴奋，我们喜欢相信每个人都可以被说服，然后，几乎每个人对我们都是自然心地善良的。像圣地亚哥·拉蒙-卡哈尔一样，你可以为追求成功而感到自豪。正是因为那些让其他人说你做不到的事情。为你自己感到自豪。特别是那些使你与众不同的品质，并将它们用作成功的秘密护身符。利用你天然的叛逆性，去反抗他人关于你能取得什么成就的始终存在的偏见。"},{"text":"我是芭芭拉·奥克利。感谢你们学习关于学习的方法。"}]},{"key":"ch-36","title":"团队合作的价值","file":"chapter-036.mp3","sha256":"16b2fb754898a2883d7fad522deed18b27ee71aa3971e84470e5f879d97b6653","paragraphs":[{"text":"这是一张CT扫描图像。如果你仔细观察，这里阴影区域揭示了由右半球缺血性中风造成的损伤。这种中风可能导致一种被称为右半球广视角知觉障碍的不寻常状况。患有这种障碍的人仍然可以运作，但只是部分地运作。他们可以保留他们的智力，甚至保留解决复杂数学问题的强大能力，如果那是他们以前拥有的技能的话。然而，一个有趣的异常现象是，如果他们在计算中犯了错误，得出了某种荒谬的结论，比如一个热狗摊的损益表显示亏损近十亿美元，这并不会困扰他们。没有大局观；没有那个点击一下说“等一下，这个答案没有意义”的声音。"},{"text":"虽然我们需要对错误的和肤浅的左脑、右脑假设保持谨慎。但我们也不想把婴儿和洗澡水一起倒掉，从而忽略那些关于大脑两个半球之间差异的有价值研究，这些研究提供了引人入胜的线索。来自研究的证据表明，右半球帮助我们退后一步，将我们的工作放入大局视角中。右半球受损的人往往无法获得顿悟。事实证明，右半球对于走上正确的轨道并进行现实检验至关重要。中风患者可以提醒我们，不使用我们全部认知能力的危险，这涉及我们大脑的许多区域。"},{"text":"即使是我们某些能力的细微回避，也可能对我们的工作产生令人惊讶的负面影响。在某种意义上，当你快速通过一道作业或测试题而不回头检查你的工作时，你表现得有点像一个人拒绝使用大脑的部分区域。你没有停下来进行心理上的深呼吸。然后带着大局观重新审视你所做的事情，看看它是否有意义。正如著名神经科学家维拉亚努尔·S·拉马钱德兰所指出的，右半球充当某种魔鬼代言人，质疑现状并寻找全局不一致性。而左半球则试图顽固地坚持事物原本的样子。这呼应了心理学家迈克尔·加扎尼加的先驱工作，他提出左半球为我们解释世界，并将竭尽全力保持这些解释不变。"},{"text":"当你处于专注模式时，很容易在你的假设或计算中犯小错误。如果你一开始就偏离了轨道，那么无论你其余的工作是否正确，你的答案仍然是错误的。有时，它甚至是可笑地错误。相当于计算出地球的周长只有两英尺半。但这些荒谬的结果对你来说并不重要，因为更偏向左脑的专注模式伴随着一种坚持你所做之事的愿望。这就是专注模式的问题，有时是一种偏向左脑的分析模式。它提供了一种分析和乐观的方法，但大量的研究证据表明，存在僵化、教条主义和自我中心的潜力。当你绝对确定你在作业或测试中所做的一切都没问题时，请意识到这种感觉可能是基于过度自信的观点，部分源于左半球。当你退后一步重新检查时，你允许两个半球之间有更多的互动，利用每个半球特殊的视角和能力。诺贝尔奖得主物理学家理查德·费曼或许说得最好，他指出，第一原则是你必须不要欺骗自己。而你是最容易欺骗的人。"},{"text":"捕捉你的盲点和错误的一个最好方法是进行头脑风暴，并与那些同样聪明地专注于该主题的人一起工作。有时，仅仅使用更多的自身神经动力是不够的，用两种模式和两个半球来分析你的工作。毕竟，每个人都有盲点。你天真乐观的专注模式仍然可能直接跳过错误，尤其是如果你是自己犯下原始错误的人。更糟糕的是，有时你会盲目地相信你在智力上已经搞定了一切，但实际上并没有。当你发现你挂科了，而你原本以为你考得很好的测试时，这种经历可能会让你感到震惊。通过有意识地与朋友一起进行一些学习，你可以更容易地捕捉到你的思维哪里出了偏差。朋友和队友可以充当一种不断质疑的、更大规模的、位于你大脑之外的发散模式，可以捕捉到你遗漏的或你根本看不到的东西。当然，向朋友解释也有助于建立你自己的理解。"},{"text":"与他人合作的重要性不仅与学习有关，在职业建设中也同样重要。来自队友的一个小建议，比如去上杰出教授“热情教授”的课程，或者查看一个新的工作机会，可能会对你的生活展开方式产生巨大的差异。然而，有一个警告；学习小组对于学习可能非常有效，但如果学习会议变成了社交场合，那就什么都说不准了。尽量减少闲聊，让你的小组走上正轨。并完成你的工作。如果你发现你的小组会议总是迟到五到十五分钟，成员没有阅读材料，对话总是偏离主题，那么你最好找另一个小组。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-37","title":"一份测试清单","file":"chapter-037.mp3","sha256":"fdb20dc6e5e9f36fb8bb83ae5d9393a3697a52e7eb57cab52b8c4e9bc86a0b48","paragraphs":[{"text":"我们之前提到过这一点，但值得再次强调。测试本身就是一种极其强大的学习体验。这意味着，你在考试中所付出的努力，包括在备考期间进行的初步回忆小测以及解决问题的能力，具有根本性的重要意义。如果你比较一下花一小时学习所获得的知识，与花一小时对同一材料进行测试所获得的知识，你会发现，通过花一小时进行测试，你保留和学到的东西要多得多。测试似乎有一种奇妙的方式能够集中注意力。我们在本课程中讨论的几乎所有内容，都是为了帮助让测试过程显得简单直接且自然，仅仅是你用来学习材料的常规程序的延伸。所以现在，是时候直接切入本课程的一个最终特征了：一份你可以用来检查你的考试准备是否到位的清单。这份清单是由传奇教育家理查德·费尔德尔（Richard Felder）制定的。虽然它最初是为工程师开发的，但实际上它适用于许多学科。正如费尔德尔博士所说，对于“我应该如何准备考试？”这个问题的答案是：尽一切努力，以便能够回答“是”。也就是说，通常要回答这份清单上的大多数问题："},{"text":"你是否认真努力理解课文？仅仅寻找相关的已解例题是不够的。"},{"text":"你是否与同学一起讨论作业问题，或者至少与他人核对你的解答？"},{"text":"在与同学讨论之前，你是否尝试为每个作业问题的解答列出提纲？"},{"text":"你是否积极参与了作业小组讨论，贡献想法并提出问题？"},{"text":"当你遇到困难时，你是否咨询了讲师或助教？"},{"text":"在提交作业时，你是否理解了你所有作业问题的解答？"},{"text":"在课堂上，你是否要求解释那些你看不懂的作业问题解答？"},{"text":"如果你有一份学习指南，是否在考试前仔细过了一遍，并确信自己能够完成上面的所有内容？"},{"text":"你是否尝试快速列出许多问题的解答提纲，而不在计算中的代数运算上花费时间？"},{"text":"你是否与同学一起复习了学习指南和问题，并互相测验？"},{"text":"如果考试前有一次复习课，你是否参加了，并就任何你不确定的地方提问？"},{"text":"最后，考试前你是否睡了一个合理的夜晚？如果你的答案是否定的，那么你对前面所有问题的答案可能都不重要。"},{"text":"参加考试是一件严肃的事情。就像战斗机飞行员和医生在起飞和手术前会检查清单一样，检查你自己的考试准备清单可以极大地提高你成功的机会。一旦你填好了费尔德尔博士的清单，“我应该如何准备考试？”这个问题的答案就会变得清晰明了。"},{"text":"我是芭芭拉·奥克利（Barbara Oakley）。感谢学习《如何学习》。"}]},{"key":"ch-38","title":"先难后易","file":"chapter-038.mp3","sha256":"21185bda9e437c78edcdfd8b0c934dd3a8804a310ed104485c857785a95418d2","paragraphs":[{"text":"既然你已经对大脑的运作方式有了一些了解，我们可以给你一些最终有用的技巧，来增强你应对考试的能力。学生被教导应对考试的经典方法是先解决最容易的问题。这是基于这样一种想法：等你做完相对简单的问题后，你就有信心去处理更难的题目了。这种方法对某些人有效，主要是因为，嗯，任何方法对某些人都会有效。然而不幸的是，对许多人来说，这种方法适得其反。难题往往需要大量的时间，这意味着你最好在考试一开始就着手解决它们。难题也可能在呼唤发散模式的创造力。但要进入发散模式，你需要不专注于你如此迫切想要解决的问题。该怎么办呢？先做简单的，还是先做难的？"},{"text":"答案是先开始做难题，但迅速跳到简单的题目。我的意思是这样的。当试卷刚发到你手中时，先快速浏览一遍，感受一下试卷包含的内容。无论如何，你都应该这样做。然后，当你开始解题时，先从那道看起来最难的题目入手。但要下定决心，如果你卡住了，或者感觉可能没有走上正确的轨道，就在最初的一两分钟内抽身离开。这样做有特别有益的效果。从难题开始会将第一道最难的题目载入脑海，然后将注意力从它身上移开。这两项活动正是允许发散模式开始发挥作用的原因。如果你最初对第一道难题的尝试让你感到不安，接下来就转向一道简单的题目，完成它或尽可能多做一点。然后，再转向另一道看起来很难的题目，试着取得一点进展。同样，一旦你感觉自己陷入困境或卡住了，就立即切换到更简单的题目。"},{"text":"当你回到那些较难的题目时，你通常会很高兴地发现，题目中的下一步或几步似乎对你来说更明显了。你可能无法立即做到最后，但至少在你切换到其他你能取得进展的事情之前，你可以走得更远。在某种意义上，采用这种考试策略，你就像一位高效的厨师。在等待牛排煎熟的同时，你可以迅速切好番茄装饰，然后去给汤调味，再搅拌那些滋滋作响的洋葱。先难后易的技巧可能通过允许大脑的不同部分同时处理不同的想法，从而更有效地利用你的大脑。"},{"text":"在考试中使用先难后易的技巧，可以确保你在每道题目上至少都完成了一点点工作。这也是帮助你避免定势效应、避免卡在错误方法上的宝贵技巧——因为你有机会从不同的视角审视问题。如果你的老师给部分分数，这一切就尤为重要。这种策略唯一的技巧在于，你必须具备自律，一旦发现自己卡住了一两分钟，就要强迫自己离开那道题。对大多数学生来说这很容易，但对其他人来说则需要自律和意志力。这可能就是为什么考生有时发现，就在他们走出考场的那一刻，答案突然浮现在脑海中；当他们放弃时，注意力转移了，允许发散模式获得它所需要的微小牵引力去发挥作用并带回答案。当然，为时已晚。"},{"text":"有时，人们担心开始一道题然后离开它可能会在考试中造成混乱。这对大多数人来说似乎不是问题。毕竟，厨师们学会了将晚餐的各个部分整合在一起。但如果你仍然担心这种策略是否适合你，先在家作业题目上试试。还要记住，如果你没有为考试做好充分的准备，那么一切结果都是未知的。只要拿到你能拿到的简单分数就好。"},{"text":"我是芭芭拉·奥克利。感谢你们学习如何学习。"}]},{"key":"ch-39","title":"考试最后的实用建议","file":"chapter-039.mp3","sha256":"059068da8fa22f804153f5218441ffbc05945d22876238d6f7579b09bc531c42","paragraphs":[{"text":"如果你是一个压力巨大的考生，请记住，当身体处于压力之下时，会分泌皮质醇等化学物质。这可能导致手心出汗、心跳加速，以及胃部感到一阵紧缩。但有趣的是，研究发现，关键在于你如何解读这些症状。你为自己讲述的关于为何感到压力的故事，决定了所有的不同。如果你将思维从“这场考试让我感到恐惧”转变为“这场考试让我兴奋，想要发挥出最佳水平”，这真的能改善你的表现。"},{"text":"对于感到恐慌的考生，另一个很好的建议是暂时将注意力转移到呼吸上。放松你的腹部，把手放在上面，然后缓慢地深吸一口气。你的手应该向外移动，同时你的整个胸部像桶一样向外扩张。通过进行这种深呼吸，你正在抵消那种驱动焦虑的“战斗或逃跑”反应。这能让你平静下来。但不要只在考试当天才开始这种呼吸。如果你在考试前的几周练习这种呼吸技巧，每次只需一两分钟就足够了。这样在考试期间，你就能更轻松地进入这种呼吸模式。记住，练习造就永久。在考试卷分发前的最后那些焦虑时刻，有意识地转向深呼吸模式，尤其有帮助。"},{"text":"我从世界各地顶尖教授那里获得了关于考试技巧的宝贵建议。这里有一些最好的建议。苏珊·萨吉纳-赫伯特是湖首大学的心理学教授，她建议学生遮住选择题的答案，尝试回忆信息。这样他们可以先自己回答问题。如果她的学生可能会抱怨模拟考比正式考试容易得多，她会问：是什么让这两种情况不同？当你做模拟考时，你是在家放松地看动画片吗？是和同学一起做的吗？没有时间限制吗？手边有答案和课堂资料吗？这些情况与拥挤的教室里时钟滴答作响且无法获取答案的情况并不完全相同。"},{"text":"特蕾西·马格兰是萨德尔贝克学院的生物科学教授，她告诉学生要直面恐惧。通常，你最坏的恐惧并不是无法获得所选职业所需的分数。你该如何应对？很简单。为备选职业制定一个B计划。一旦你为最坏的情况制定了计划，你会惊讶地发现恐惧开始消退。马格兰教授指出，在考试当天之前努力学习，然后放手。告诉自己，好吧，让我看看我能答对多少题。我总是可以追求我的其他职业选择。这有助于释放压力，这样你实际上可以做得更好，更接近你的第一职业选择。奥洛尼学院（Ohlone College）的数学教授鲍勃·布拉德肖告诉学生关于“好的担忧”和“坏的担忧”。“好的担忧”有助于提供动力和专注，而“坏的担忧”只是浪费精力。"},{"text":"这里还有几点最后的思考。在考试前一天，或者多场考试前一天，快速最后浏览一遍材料，以巩固它们。第二天，你从某种意义上说，需要用到你的专注模式和发散模式肌肉。所以你不希望把大脑逼得太紧。你不会在跑马拉松的前一天去跑十英里。如果你在大考前一天似乎无法让自己太努力，不要感到内疚。如果你准备得当，这似乎是一种自然的反应，几乎就像你在潜意识里退缩以保存心理能量。在考试期间，你还应该记住，你的大脑可能会欺骗你，让你认为你所做的是正确的，即使它并不正确。这意味着，只要可能，你应该眨眼，转移注意力，然后使用一种宏观视角来双重检查你的答案，问自己：这真的说得通吗？"},{"text":"回答一个问题通常不止一种方法，从不同角度检查你的答案提供了验证你所做内容的黄金机会。如果没有其他检查方法，除了通过你的逻辑回溯，请记住，简单的问题甚至会让最先进的学生出错。尽力而为即可。在科学课上，确保等式两边的测量单位匹配，可以提供关于你所做内容是否正确的重要线索。你做题的顺序也很重要。学生通常从前到后做题。当你检查工作，如果你从后往前做，有时似乎能给大脑一个更新鲜的视角，让你更容易发现错误。没有什么事情是确定的。偶尔，你可以努力学习，但考试之神就是不配合，但如果你通过练习和建立强大的脑内知识库来充分准备，并明智地对待考试，你会发现运气会越来越站在你这边。"},{"text":"我是芭芭拉·奥克利。感谢学习如何学习。"}]},{"key":"ch-40","title":"第四周总结","file":"chapter-040.mp3","sha256":"541fd498c5ea00fda917c5ed114400aab25c60aea926e522530457e9c15b63f1","paragraphs":[{"text":"本周，我们广泛地探索了学习过程中一些最深层次的方面。"},{"text":"隐喻和类比不仅仅是艺术和文学的专属。要想不仅记住，而且更容易理解许多不同领域的概念，你能做的最好的事情之一，就是为它们创造一个隐喻或类比。通常，越具视觉化效果越好。"},{"text":"我们从诺贝尔奖得主圣地亚哥·拉蒙-卡哈尔那里学到，如果你改变你的想法，你真的、确实可以改变你的生活。似乎人们可以通过练习使用那些神经元的思维，来增强他们神经回路的发展。像圣地亚哥·拉蒙-卡哈尔一样，你可以因为那些让其他人说你做不到之事，而为自己追求成功感到自豪。"},{"text":"请记住，当你飞快地做完一道作业或考试题目，却不回头检查你的工作时，你表现得有点像是一个拒绝使用大脑部分功能的人。你没有停下来在脑海中深呼吸，然后带着全局观念重新审视你所做的一切，看看它是否合乎逻辑。"},{"text":"对结果的过度自信可能源于只使用一种思维模式。通过刻意安排一些与朋友一起学习的环节，你可以更容易地捕捉到你的思维在何处偏离了轨道。"},{"text":"参加考试是一件严肃的事情，就像战斗机飞行员和医生在起飞和手术前会检查清单一样，过一遍你自己的考试准备清单，可以极大地提高你成功的机会。"},{"text":"像“从难到易”这种反直觉的策略，可以让你的大脑有机会反思更困难的挑战，即使你正在专注于其他更直接的问题。"},{"text":"这里有一些最后的考试技巧："},{"text":"当身体处于压力之下时，会分泌化学物质。你如何解读身体对这些化学物质的反应，会产生巨大的差别。如果你将思维从“这次考试让我感到害怕”转变为“这次考试让我兴奋，想要发挥最佳水平”，这有助于提高你的表现。"},{"text":"如果你在考试中感到恐慌，暂时将注意力转移到你的呼吸上。放松你的腹部，把手放在上面，然后缓慢地深吸一口气。你的手应该向外移动，你的整个胸部应该像桶一样扩张。"},{"text":"你的大脑可能会欺骗你，让你认为你所做的是正确的，即使它并不是。这意味着，只要有可能，你就应该眨眼，转移注意力，然后从全局视角双重检查你的答案，问自己：这真的合乎逻辑吗？"},{"text":"最后，请记住，考试前一晚睡眠不足可能会抵消你所做的任何其他准备。"},{"text":"我是芭芭拉·奥克利。感谢大家学习关于学习的知识。"}]},{"key":"ch-41","title":"特伦斯·塞诺斯基和芭芭拉·奥克利对课程的总结","file":"chapter-041.mp3","sha256":"8829bb1f14e65d7cfd2b776cc06975a5017fe01e6f0f3e100b253695990203c9","paragraphs":[{"text":"塞诺斯基博士：欢迎来到《学会学习》课程的最后一个视频。如果你还在听我们讲课，那么你已经完整地走完了整个课程。你可能还记得，在课程开始时，我说过大脑并不附带使用说明书。因此，我们必须自己编写一份。这正是我们的目标之一。在这个最后的视频中，我们想告诉你们，我们有多么享受教学与学习的过程。正如我们希望从你们那里学到东西一样，我们也从你们身上学到了许多。事实是，在你们自己的学习过程中，你们始终掌握着方向盘。但现在，既然你们对大脑内部机制有了更清晰的认识，你们就可以利用这些知识，帮助自己在整个生命周期中学习新事物。"},{"text":"奥克利博士：我们希望，随着日子和月份的流逝，你们能继续回想起在课程中学到的一些关键理念。例如，将思维模式从专注模式切换到发散模式，可以帮助减少挫败感，并促进更具创造性的问题解决。强化组块能力，可以让你们更牢固地掌握材料。即使是日常工作中看似微小的改变，例如使用番茄工作法，也能在你们的学习和最终的成功中产生巨大的长期影响。"},{"text":"塞诺斯基博士：学习对我们的未来至关重要，以至于我们大多数人都在生命最初的十二到十六年里在学校度过，最终进入高中或大学。但正规教育的重点在于学习的成果，而非学习的过程。在这门课程中，我们试图让你们对学习过程有更好的理解。虽然这是我们的最后一个视频，但我们希望这不是我们影响你们的最后一次机会。除非你能把学到的东西教给别人，否则你并没有真正学会它。把这些理念教给别人，你会发现它们会在你自己的脑海中持续产生共鸣并不断深化。"},{"text":"奥克利博士：我们也希望，你们已经发现这些理念在帮助你们拓宽兴趣、热情和专业知识方面有多么强大。许多人认为，他们最初天生擅长的事情，就是他们一生中应该做的事情。但我本人就是活生生的证明，热情是可以拓宽、改变和成长的。世界在不断演变，而一套能让你在许多不同学科领域有效学习的广泛工具包，是你所能拥有的最强大的资产之一。"},{"text":"塞诺斯基博士：祝你们在学习之路上好运。"},{"text":"奥克利博士：同感。"}]}]}</script>

<script>
const book=JSON.parse(document.getElementById('data').textContent),audio=document.getElementById('audio'),storage='audio-book-public-'+book.book_id;
const $=id=>document.getElementById(id),report=text=>$('status').textContent=text;
let current=0,positions={},loading=true,autoNext=true,selection=0;
const safe=f=>async(...args)=>{try{await f(...args)}catch(e){report('操作未完成：'+e.message)}};
const clock=seconds=>{const n=Number.isFinite(seconds)?Math.max(0,Math.floor(seconds)):0;return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function persist(){try{localStorage.setItem(storage,JSON.stringify({current:book.chapters[current].key,positions,speed:$('speed').value,autoNext}))}catch(e){report('此浏览器无法保存续听位置')}}
const remember=()=>{if(loading)return;const c=book.chapters[current];positions[c.key]={sha256:c.sha256,seconds:audio.currentTime};persist()};
function updateAuto(){$('auto').setAttribute('aria-checked',String(autoNext));$('auto').title=autoNext?'关闭连续播放':'开启连续播放'}
function updatePlay(){const paused=audio.paused;$('play-icon').toggleAttribute('hidden',!paused);$('pause-icon').toggleAttribute('hidden',paused);$('play').setAttribute('aria-label',paused?'播放':'暂停');$('play').title=paused?'播放':'暂停';$('play').disabled=loading}
function updateProgress(){const time=Number.isFinite(audio.currentTime)?audio.currentTime:0,duration=Number.isFinite(audio.duration)?audio.duration:0,percent=duration>0?Math.min(100,time/duration*100):0;$('elapsed').textContent=clock(time);$('duration').textContent=clock(duration);$('seek-fill').style.width=percent+'%';$('seek-dot').style.left=percent+'%';$('seek').setAttribute('aria-valuemax',String(Math.floor(duration)));$('seek').setAttribute('aria-valuenow',String(Math.floor(time)));$('seek').setAttribute('aria-valuetext',Math.floor(time/60)+' 分 '+Math.floor(time%60)+' 秒，共 '+clock(duration));$('seek').setAttribute('aria-disabled',String(loading))}
function select(index,play=false){
 if(index<0||index>=book.chapters.length)return;
 loading=true;audio.pause();current=index;const nonce=++selection,c=book.chapters[index],saved=positions[c.key],resume=saved?.sha256===c.sha256&&Number.isFinite(saved.seconds)&&saved.seconds>=0?saved.seconds:0;
 audio.src=book.media?.[c.file]||document.getElementById('offline-audio-'+index)?.textContent.trim()||c.file;audio.playbackRate=Number($('speed').value);
 $('title').textContent=c.title;$('player-title').textContent=String(index+1).padStart(2,'0')+' · '+c.title;$('player-title').setAttribute('aria-label','选择章节，当前第 '+(index+1)+' 节：'+c.title);$('kicker').textContent='第 '+String(index+1).padStart(2,'0')+' 节 / 共 '+book.chapters.length+' 节';$('mobile-count').textContent=(index+1)+' / '+book.chapters.length;
 $('download').href=audio.src;$('download').download=c.file;$('chapter-duration').textContent='正在载入音频';
 $('text').replaceChildren(...c.paragraphs.map(p=>{const x=document.createElement('p');x.textContent=p.text;return x}));
 document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
 audio.onloadedmetadata=safe(()=>{if(selection!==nonce)return;const settled=()=>{if(selection!==nonce)return;loading=false;$('chapter-duration').textContent='本节 '+clock(audio.duration);updatePlay();updateProgress();remember();if(play)audio.play().catch(()=>report('请点击播放继续'))};if(resume>0&&resume<audio.duration-1){audio.addEventListener('seeked',safe(settled),{once:true});audio.currentTime=resume;if(!audio.seeking)settled()}else settled()});
 $('previous').disabled=index===0;$('next').disabled=index===book.chapters.length-1;updatePlay();updateProgress();report('');
}
try{const old=JSON.parse(localStorage.getItem(storage)||'null');if(old){const i=book.chapters.findIndex(c=>c.key===old.current);current=i>=0?i:0;if(old.positions&&typeof old.positions==='object')for(const c of book.chapters){const p=old.positions[c.key];if(p?.sha256===c.sha256&&Number.isFinite(p.seconds)&&p.seconds>=0)positions[c.key]=p}if(['0.9','1','1.1','1.25'].includes(old.speed))$('speed').value=old.speed;if(typeof old.autoNext==='boolean')autoNext=old.autoNext}}catch(e){report('已忽略无法读取的浏览器记录')}
const mobile=matchMedia('(max-width:800px)');$('toc-panel').open=!mobile.matches;mobile.addEventListener('change',e=>{$('toc-panel').open=!e.matches});
$('toc-panel').addEventListener('toggle',()=>{if(!mobile.matches&&!$('toc-panel').open)$('toc-panel').open=true});
function moveToReader(){if(mobile.matches)$('toc-panel').open=false;$('reader').scrollIntoView({block:'start'});$('title').setAttribute('tabindex','-1');$('title').focus({preventScroll:true})}
book.chapters.forEach((c,i)=>{const b=document.createElement('button');b.className='chapter';const n=document.createElement('span'),title=document.createElement('span');n.className='chapter-num';n.textContent=String(i+1).padStart(2,'0');title.className='chapter-title';title.textContent=c.title;b.append(n,title);b.addEventListener('click',safe(()=>{remember();select(i);moveToReader()}));$('chapters').append(b)});
const name=book.name.replace(/ · F 清晰咬字版$/,'');$('book-title').textContent=name;$('brand-name').textContent=name;document.title=name;if(!book.complete){$('closing').hidden=false;$('delivery-status').textContent='制作预览：已完成 '+book.chapters.length+'/'+book.expected_chapters+' 节，整书仍在制作。'}
if(name==='学会学习'){$('intro').textContent='认识大脑，练习记忆，走出拖延。\n让更好的学习方法，慢慢走进日常。';$('intro').style.whiteSpace='pre-line'}
$('next').onclick=safe(()=>{remember();select(current+1);moveToReader()});$('previous').onclick=safe(()=>{remember();select(current-1);moveToReader()});
$('play').onclick=safe(async()=>{if(loading)return;if(audio.paused)await audio.play();else audio.pause()});
function seekTo(seconds){if(loading||!Number.isFinite(audio.duration))return;audio.currentTime=Math.max(0,Math.min(audio.duration,seconds));updateProgress()}
$('back').onclick=safe(()=>seekTo(audio.currentTime-15));$('forward').onclick=safe(()=>seekTo(audio.currentTime+30));
let seekPointer=null;
function seekAt(e){const box=$('seek').getBoundingClientRect();seekTo(Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*audio.duration)}
$('seek').addEventListener('pointerdown',safe(e=>{if(e.button!==0||loading)return;e.preventDefault();$('seek').focus({preventScroll:true});seekPointer=e.pointerId;$('seek').setPointerCapture(e.pointerId);seekAt(e)}));
$('seek').addEventListener('pointermove',safe(e=>{if(e.pointerId===seekPointer)seekAt(e)}));
$('seek').addEventListener('pointerup',safe(e=>{if(e.pointerId!==seekPointer)return;seekAt(e);seekPointer=null}));
$('seek').addEventListener('pointercancel',()=>{seekPointer=null});
$('seek').addEventListener('keydown',safe(e=>{let target;if(e.key==='ArrowLeft'||e.key==='ArrowDown')target=audio.currentTime-5;else if(e.key==='ArrowRight'||e.key==='ArrowUp')target=audio.currentTime+5;else if(e.key==='Home')target=0;else if(e.key==='End')target=audio.duration;else if(e.key==='PageDown')target=audio.currentTime-30;else if(e.key==='PageUp')target=audio.currentTime+30;else return;e.preventDefault();seekTo(target)}));
const speedValues=['0.9','1','1.1','1.25'];
function updateSpeed(value){if(!speedValues.includes(value))return;$('speed').value=value;$('speed-value').textContent=value+'×';$('speed').setAttribute('aria-label','播放速度，当前 '+value+' 倍');audio.playbackRate=Number(value);$('speed-menu').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.speed===value)))}
function closeSpeed(restore=false){$('speed-menu').hidden=true;$('speed').setAttribute('aria-expanded','false');if(restore)$('speed').focus()}
function openSpeed(focus=false){$('speed-menu').hidden=false;$('speed').setAttribute('aria-expanded','true');if(focus)$('speed-menu').querySelector('[aria-checked=true]')?.focus()}
speedValues.forEach(value=>{const b=document.createElement('button');b.className='speed-option';b.tabIndex=-1;b.dataset.speed=value;b.setAttribute('role','menuitemradio');const label=document.createElement('span');label.textContent=value+'×';const mark=document.createElementNS('http://www.w3.org/2000/svg','svg');mark.setAttribute('viewBox','0 0 16 16');mark.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','m3 8 3 3 7-7');path.setAttribute('fill','none');path.setAttribute('stroke','currentColor');path.setAttribute('stroke-width','1.5');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');mark.append(path);b.append(label,mark);b.onclick=safe(()=>{updateSpeed(value);persist();closeSpeed(true)});$('speed-menu').append(b)});
$('speed').onclick=safe(e=>{if($('speed-menu').hidden)openSpeed(e.detail===0);else closeSpeed()});
$('speed').addEventListener('keydown',safe(e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openSpeed(true)}else if(e.key==='Escape'){e.preventDefault();closeSpeed(true)}}));
$('speed-menu').addEventListener('keydown',safe(e=>{const buttons=[...$('speed-menu').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);let next;if(e.key==='ArrowDown')next=(i+1)%buttons.length;else if(e.key==='ArrowUp')next=(i-1+buttons.length)%buttons.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=buttons.length-1;else if(e.key==='Escape'){e.preventDefault();closeSpeed(true);return}else return;e.preventDefault();buttons[next].focus()}));
document.addEventListener('pointerdown',e=>{if(!$('speed-picker').contains(e.target))closeSpeed()});
$('speed-picker').addEventListener('focusout',()=>{setTimeout(()=>{if(!$('speed-picker').contains(document.activeElement))closeSpeed()},0)});window.addEventListener('resize',()=>closeSpeed());
updateSpeed($('speed').value);$('auto').onclick=safe(()=>{autoNext=!autoNext;updateAuto();persist()});updateAuto();
audio.addEventListener('timeupdate',safe(()=>{updateProgress();remember()}));audio.addEventListener('seeked',safe(()=>{updateProgress();remember()}));audio.addEventListener('error',()=>{loading=true;updatePlay();report('音频加载失败，请重新打开本页')});audio.addEventListener('play',()=>{updatePlay();report('')});audio.addEventListener('pause',()=>{updatePlay();report('')});
audio.addEventListener('ended',safe(()=>{const c=book.chapters[current];positions[c.key]={sha256:c.sha256,seconds:0};persist();if(autoNext&&current+1<book.chapters.length)select(current+1,true);else report('本节播放完成')}));
window.addEventListener('pagehide',remember);
$('player-title').onclick=safe(()=>{$('toc-panel').open=true;document.querySelector('.sidebar').scrollIntoView({block:'start'});document.querySelector('nav button[aria-current=true]')?.scrollIntoView({block:'nearest'});$('toc-panel').querySelector('summary').focus({preventScroll:true})});
const setPlayerSpace=()=>document.documentElement.style.setProperty('--player-space',($('player-shell').getBoundingClientRect().height+40)+'px');new ResizeObserver(setPlayerSpace).observe($('player-shell'),{box:'border-box'});setPlayerSpace();
select(current);
</script>
